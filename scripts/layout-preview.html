<!doctype html><html><head><meta charset="utf-8"><title>Candor responsive review</title><style>body{margin:0;background:#e7e7e7;font:14px system-ui}nav{display:flex;gap:12px;padding:10px;position:sticky;left:0;top:0;background:#fff}button{padding:7px 12px}iframe{display:block;background:white;border:1px solid #888;margin:12px;width:390px;height:844px}</style></head><body><nav aria-label="Preview size"><button data-size="320,740">Small phone</button><button data-size="390,844">Phone</button><button data-size="768,900">Tablet</button><button data-size="1024,900">Laptop</button><button data-size="1440,1000">Desktop</button><span id="size">390 × 844</span></nav><iframe title="Candor preview" src="http://127.0.0.1:8777/app.html"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';document.querySelector('#size').textContent=w+' × '+h;});</script></body></html>
