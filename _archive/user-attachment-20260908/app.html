  '<button class="qhint" data-action="mod-help" data-mod="' + id + '" title="How this works">?</button>' +
  '<div class="flex-r">' + (right || '') + '</div></div>';

/* ---- Getting started (endowed progress; steps derived from data) ---- */
function setupSteps() {
  return [
    { lab: 'Open the app', done: true, sub: '' },
    { lab: 'Log your first role', done: state.applications.length > 0, sub: 'Paste the job ad in — it fills the form for you.', action: 'new-app' },
    { lab: 'Set a weekly target you can actually hit', done: !!state.settings.weeklyTouched, sub: 'Small on purpose — change it any time.', action: 'edit-weekly' },
    { lab: 'Make the first move on a role', done: state.contacts.length > 0 || state.applications.some(a => a.dateApplied || (a.log || []).length > 1), sub: 'Warm route: find one person. Direct route: submit it.', action: 'setup-first-move' },
  ];
}
function modSetup() {
  if (state.settings.onboardingDismissed) return '';
  const steps = setupSteps();
  const doneN = steps.filter(s => s.done).length;
  if (doneN === steps.length) return '';
  const rows = steps.map((s, i) => s.done
    ? '<div class="su-step done"><i>✓</i><span>' + s.lab + '</span></div>'
    : '<button class="su-step" data-action="' + s.action + '"><i>' + (i + 1) + '</i><span>' + s.lab + (s.sub ? '<em>' + s.sub + '</em>' : '') + '</span><b>→</b></button>').join('');
  return '<div class="card panel setup-card">' + modTitle('setup', '<button class="rmini" data-action="setup-dismiss">dismiss</button>') +
    '<div class="su-head"><div class="su-track"><span style="width:' + Math.round(doneN / steps.length * 100) + '%"></span></div><span class="su-count">' + doneN + ' of ' + steps.length + '</span></div>' +
    rows + '</div>';
}

/* ---- The one move ---- */
function modHero(ctx) {
  const hero = ctx.moves[0];
  const label = m => {
    if (m.action === 'open-role') { const a = state.applications.find(x => x.id === m.id); return 'Open ' + esc(a ? a.company : 'the role') + ' →'; }
    if (m.action === 'edit-task') return 'Open the task →';
    return 'Go →';
  };
  const q = '<button class="qhint" data-action="mod-help" data-mod="hero" title="How this works">?</button>';
  return hero
    ? '<div class="card panel hero-move">' +
        '<div class="hm-kicker">Start here' + q + '</div>' +
        '<div class="hm-title">' + esc(hero.title) + (hero.overdue ? ' <span class="tag warn">overdue</span>' : '') + '</div>' +
        '<div class="hm-sub">' + esc(hero.sub) + '</div>' +
        '<button class="btn primary" data-action="' + hero.action + '"' + (hero.id ? ' data-id="' + hero.id + '"' : '') + '>' + label(hero) + '</button>' +
      '</div>'
    : '<div class="card panel hero-move">' +
        '<div class="hm-kicker">All clear' + q + '</div>' +
        '<div class="hm-title">Nothing is waiting on you.</div>' +
        '<div class="hm-sub">Best use of a clear day: add one new role worth chasing, or send one new message on an existing one.</div>' +
        '<button class="btn primary" data-action="new-app">＋ Add a role</button>' +
      '</div>';
}

/* ---- After that ---- */
function modThen(ctx) {
  const rest = ctx.moves.slice(1, 4);
  if (!rest.length) return '';
  return '<div class="card panel">' + modTitle('then') +
    rest.map(m => '<button class="move" data-action="' + m.action + '"' + (m.id ? ' data-id="' + m.id + '"' : '') + '>' +
      '<span class="m-ico">' + m.icon + '</span>' +
      '<span class="m-body"><span class="m-title">' + esc(m.title) + '</span>' +
      '<span class="m-sub">' + esc(m.sub) + '</span></span>' +
      (m.overdue ? '<span class="tag warn">overdue</span>' : '') + '</button>').join('') +
    (ctx.moves.length > 4 ? '<div class="more-note">' + (ctx.moves.length - 4) + ' more queued — they surface as these clear.</div>' : '') +
    '</div>';
}

/* ---- This week: rings + 8-week chart. Never a 0/N — an empty ring shows
   the target as capacity ahead, not a score of zero. ---- */
function ringSVG(have, want, lab, ghost) {
  const R = 26, C = 2 * Math.PI * R;
  const pct = ghost ? 0 : Math.min(1, have / Math.max(1, want));
  return '<div class="ring' + (ghost ? ' ghost' : '') + '">' +
    '<svg viewBox="0 0 64 64" width="66" height="66" aria-hidden="true">' +
      '<circle cx="32" cy="32" r="' + R + '" class="ring-track"/>' +
      (ghost ? '' : '<circle cx="32" cy="32" r="' + R + '" class="ring-bar' + (have >= want ? ' hit' : '') + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '" transform="rotate(-90 32 32)"/>') +
      '<text x="32" y="31" class="ring-n">' + (ghost ? want : have) + '</text>' +
      '<text x="32" y="43" class="ring-of">' + (ghost ? 'target' : 'of ' + want) + '</text>' +
    '</svg><span class="ring-lab">' + lab + '</span></div>';
}
function modWeek(ctx) {
  const w = ctx.w;
  const acted = w.now.outreach > 0 || w.now.applications > 0;
  const rings = '<div class="rings">' +
    ringSVG(w.now.outreach, w.target.outreach, 'messages', !acted) +
    ringSVG(w.now.applications, w.target.applications, 'applications', !acted) +
    '<div class="rings-side">' + (acted
      ? '<div class="evnote" style="margin:0">Actions you took, never outcomes. Volume alone predicts offers at r = .14 (van Hooft 2021) — nothing here rewards it.</div>'
      : '<div class="week-quiet" style="padding:0">Nothing sent yet this week — the rings fill as you act. Your next move is on this page.</div>') +
    '</div></div>';
  const maxO = Math.max(w.target.outreach, ...w.weeks.map(x => x.outreach), 1);
  const history = w.weeks.some(x => !x.current && x.outreach > 0);
  const chart = history
    ? '<div class="wchart">' +
        '<span class="wtarget" style="bottom:' + Math.round(w.target.outreach / maxO * 100) + '%"></span>' +
        w.weeks.map(x => '<span class="wbar' + (x.onTarget ? ' on' : '') + (x.current ? ' now' : '') + '" title="Week of ' + x.key + ' · ' + x.outreach + ' message' + (x.outreach === 1 ? '' : 's') + '"><i style="height:' + Math.max(6, Math.round(x.outreach / maxO * 100)) + '%"></i></span>').join('') +
      '</div>' +
      '<div class="wchart-lab"><span>8 weeks ago</span><span>' + w.onTargetCount + '/8 on target</span><span>now</span></div>' +
      '<div class="evnote" style="margin-top:7px">Separate weeks, not a chain — a missed week costs one bar, never the run (Silverman &amp; Barasch 2023).</div>'
    : '';
  return '<div class="card panel">' + modTitle('week', '<button class="btn sm ghost" data-action="edit-weekly">edit target</button>') + rings + chart + '</div>';
}

/* ---- Next 7 days (agenda, not a month grid — a job search has a dozen
   dated items; a calendar of empty cells is decoration) ---- */
function modUpcoming() {
  const items = [];
  state.tasks.filter(t => !t.done && t.due).forEach(t =>
    items.push({ date: t.due, ico: '☑', text: t.title, action: 'edit-task', id: t.id }));
  state.applications.filter(isActive).forEach(a => {
    if (a.nextActionDate) items.push({ date: a.nextActionDate, ico: '🎯', text: a.company + ' — ' + (a.nextAction || 'next step'), action: 'open-role', id: a.id });
  });
  state.contacts.forEach(c => {
    if (!c.nextFollowUp) return;
    const a = state.applications.find(x => x.id === c.appId);
    items.push({ date: c.nextFollowUp, ico: '📨', text: 'Follow up — ' + c.name + (a ? ' (' + a.company + ')' : ''), action: a ? 'open-role' : '', id: a && a.id });
  });
  const byDay = {};
  items.forEach(it => {
    const n = daysFromToday(it.date);
    if (n === null || n > 6) return;
    const k = n < 0 ? 'over' : it.date;
    (byDay[k] = byDay[k] || []).push(it);
  });
  const row = it => '<button class="ag-item"' + (it.action && it.id ? ' data-action="' + it.action + '" data-id="' + it.id + '"' : ' disabled') + '><span class="ag-ico">' + it.ico + '</span><span>' + esc(it.text) + '</span></button>';
  let out = '';
  if (byDay.over) out += '<div class="ag-day"><span class="ag-lab due">Overdue</span>' + byDay.over.map(row).join('') + '</div>';
  for (let i = 0; i < 7; i++) {
    const iso = isoPlus(i);
    if (!byDay[iso]) continue;
    const lab = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : new Date(iso + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'short' });
    out += '<div class="ag-day"><span class="ag-lab">' + lab + '</span>' + byDay[iso].map(row).join('') + '</div>';
  }
  if (!out) out = '<div class="dhint" style="margin:4px 0 2px">Nothing dated in the next 7 days. Due dates on tasks, follow-ups and role next-steps land here.</div>';
  return '<div class="card panel">' + modTitle('upcoming') + out + '</div>';
}

/* ---- Funnels — only once readable ---- */
function modFunnels(ctx) {
  const f = ctx.f;
  if (f.reach[0].n < 4 && f.app[0].n < 4) return '';
  return '<div class="card panel">' + modTitle('funnels') +
    '<div class="fun2">' +
      '<div><div class="fun-h">Outreach</div>' + funnelHTML(f.reach, 'Add people and log a touch.') + '</div>' +
      '<div><div class="fun-h">Applications</div>' + funnelHTML(f.app, 'Nothing submitted yet.') + '</div>' +
    '</div></div>';
}

/* ---- Tasks (also used on the empty-state page) ---- */
let showAllTasks = false;
function tasksBlock() {
  const open = state.tasks.filter(t => !t.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  const done = state.tasks.filter(t => t.done).sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
  const list = showAllTasks ? open : open.slice(0, 5);
  const trow = t => {
    const n = t.due ? daysFromToday(t.due) : null;
    const linked = t.linkedType === 'application' ? appById(t.linkedId) : null;
    return '<label class="trow' + (t.done ? ' isdone' : '') + '"><input type="checkbox" data-action="toggle-task" data-id="' + t.id + '"' + (t.done ? ' checked' : '') + '>' +
      '<span class="t-title">' + esc(t.title) + (linked ? ' <span class="t-linkco">' + esc(linked.company) + '</span>' : '') + '</span>' +
      (!t.done && t.due ? '<span class="t-due' + (n !== null && n <= 0 ? ' due' : '') + '">' + relDue(t.due) + '</span>' : '') +
      '<button class="rmini" data-action="edit-task" data-id="' + t.id + '">edit</button></label>';
  };
  const doneBlock = done.length
    ? '<details class="tdone"><summary>Done · ' + done.length + '<span class="tdone-hint">uncheck to restore</span></summary>' + done.slice(0, 20).map(trow).join('') + '</details>'
    : '';
  return '<div class="card panel">' + modTitle('tasks',
      (open.length > 5 ? '<button class="btn sm ghost" data-action="toggle-all-tasks">' + (showAllTasks ? 'top 5' : 'all ' + open.length) + '</button>' : '') +
      '<button class="btn sm" data-action="new-task-modal">+ Task</button>') +
    (list.map(trow).join('') || '<div class="dhint" style="margin:4px 0 2px">No open tasks. Tasks can be general — they don&#39;t have to belong to a role.</div>') +
    doneBlock + '</div>';
}
function modTasks() { return tasksBlock(); }

const MOD_RENDER = { setup: modSetup, hero: modHero, then: modThen, week: modWeek, upcoming: modUpcoming, tasks: modTasks, funnels: modFunnels };

function viewToday() {
  const ctx = { moves: computeMoves(), w: weekStats(), f: funnels() };

  /* True start state: no roles logged. One card, one action, zero guilt.
     Removing steps is the strongest documented lever (Bettinger et al. 2012:
     one removed step, +8.1pp completions). */
  if (state.applications.length === 0) {
    return '<div class="content-inner">' +
      '<div class="start-card">' +
        '<div class="sc-kicker">You are at the start, not behind</div>' +
        '<div class="sc-title">Add one role you would actually want.</div>' +
        '<div class="sc-sub">That is the whole job today. Paste the job ad in and the form fills itself — one row unlocks everything else here.</div>' +
        '<div class="sc-actions">' +
          '<button class="btn primary" data-action="new-app">＋ Add a role</button>' +
          '<button class="btn ghost sm" data-action="go-settings">or import a backup</button>' +
        '</div>' +
      '</div>' +
      '<div class="start-mods">' + modSetup() + (state.tasks.length ? tasksBlock() : '') + '</div>' +
      '</div>';
  }

  const lastAction = [].concat(
    state.contacts.flatMap(c => (c.log || []).map(l => l.date)),
    state.applications.map(a => a.dateApplied).filter(Boolean)
  ).sort().pop();
  const away = lastAction ? -daysFromToday(lastAction) : null;
  const comeback = (away !== null && away >= 4)
    ? '<div class="comeback">' +
        '<div class="cb-h">' + away + ' days since your last message.</div>' +
        '<div class="cb-b">Nothing to make up. Pick one role and send one message — that is the whole session.</div>' +
        '<button class="btn primary sm" data-action="comeback">Open the easiest one</button>' +
        '<div class="evnote" style="margin-top:10px">In the 61,293-person gym megastudy (Milkman et al., <i>Nature</i> 2021, 54 arms tested), the top-ranked intervention of all 54 was a bonus for <b>returning after a missed session</b>. Rewarding an unbroken run ranked nowhere. Coming back is the thing that gets rewarded here.</div>' +
      '</div>'
    : '';

  const mods = TODAY_ORDER.map(id => {
    const m = TODAY_MODULES[id];
    const inner = MOD_RENDER[id](ctx) || '';
    if (!inner) return '';
    return '<div class="tmod' + (m.span === 2 ? ' span2' : '') + '" data-mod="' + id + '">' + inner + '</div>';
  }).join('');

  return '<div class="content-inner">' + comeback + '<div class="today-mods">' + mods + '</div></div>';
}

/* ================================================================
   Roles — one sheet, one drawer. Every row is a role you're chasing.
   ================================================================ */
let roleFilters = { q: '', market: '', stage: 'active', priority: '', cold: false };
let selectedApps = new Set();

/* Four steps, in order. You cannot look ready without a human attached. */
/* Four things you DO, in order. Nothing here is a state of mind.
   Harkin et al. 2016 (Psych Bulletin, k=138 RCTs, N=19,951): monitoring a
   BEHAVIOUR moves that behaviour (d+ = 0.79); monitoring outcomes does not
   move behaviour (d+ = 0.14, null). So every dot is an action, never an insight. */
const READY_STEPS = [
  { k: 'logged',  lab: 'Logged',  hint: 'It exists in the list. That is the whole bar.' },
  { k: 'human',   lab: 'Person',  hint: 'One name attached. Referrals convert ~30x inbound (Ashby, 38M applications).' },
  { k: 'sent',    lab: 'Sent',    hint: 'You actually sent a message. Not drafted — sent.' },
  { k: 'applied', lab: 'Applied', hint: 'Submitted. Inbound is still 52% of startup hires — apply, just not only.' },
];
/* Direct-route roles skip the outreach chain entirely. Both routes are
   legitimate: referrals convert ~30x per application, but inbound is still
   52% of startup hires (Ashby, 38M applications). The app nags about people
   only where you chose the warm route. */
const DIRECT_STEPS = [
  { k: 'logged',  lab: 'Logged',  hint: 'It exists in the list.' },
  { k: 'applied', lab: 'Applied', hint: 'Submitted, date logged.' },
];
function stepsFor(a) { return a.approach === 'direct' ? DIRECT_STEPS : READY_STEPS; }
function readiness(a) {
  const people = roleContacts(a.id);
  return {
    logged: true,
    human: people.length > 0,
    sent: people.some(c => (c.log || []).length > 0),
    applied: !!a.dateApplied,
    talked: people.some(c => ['replied', 'call_booked', 'met'].includes(c.status)),
    people,
  };
}
/* Touch count across every person on this role. Pin (4M messages): three touches
   capture 93.2% of all replies; the 4th yields 4.5%. We hard-stop at 3. */
function touchCount(a) { return roleContacts(a.id).reduce((n, c) => n + (c.log || []).length, 0); }
const MAX_TOUCHES = 3;
function readyCount(a) { const r = readiness(a), st = stepsFor(a); return st.filter(s => r[s.k]).length / st.length; }

function filteredApps() {
  let list = state.applications.slice();
  const f = roleFilters;
  if (f.stage === 'active') list = list.filter(isActive);
  else if (f.stage === 'closed') list = list.filter(a => !isActive(a));
  else if (f.stage) list = list.filter(a => a.stage === f.stage);
  if (f.market === '__focus') list = list.filter(a => a.market === FOCUS_MARKET);
  else if (f.market) list = list.filter(a => a.market === f.market);
  if (f.priority) list = list.filter(a => a.priority === f.priority);
  if (f.cold) list = list.filter(a => a.approach !== 'direct' && !roleContacts(a.id).length);
  if (f.q) {
    const q = f.q.toLowerCase();
    list = list.filter(a => (a.company + ' ' + a.role + ' ' + (a.location||'') + ' ' + (a.hook||'') + ' ' + (a.notes||'')).toLowerCase().includes(q));
  }
  const k = tableSort.key, dir = tableSort.dir;
  if (k === 'ready') list.sort((a, b) => (readyCount(a) - readyCount(b)) * dir);
  else list.sort((a, b) => String(a[k] || '').localeCompare(String(b[k] || '')) * dir);
  return list;
}

/* The one column a spreadsheet can't give you. Every branch names an ACTION. */
function nextMove(a) {
  const r = readiness(a);
  if (!isActive(a)) return { text: '—', cls: 'muted' };
  if (a.approach === 'direct') {
    if (!r.applied) {
      const wk = weeksSincePosted(a);
      if (wk !== null && wk < 1) return { text: 'Apply in a few days — week-1 pile is 2.5–3x deeper', cls: 'warn' };
      return { text: 'Apply — direct route', cls: '' };
    }
    // Post-apply outreach accepted (or contacts added): the follow-up engine
    // runs for this role's people exactly as it does on the warm route.
    const dueD = r.people
      .filter(c => (c.log || []).length && (c.log || []).length < MAX_TOUCHES && !['replied','call_booked','met'].includes(c.status))
      .map(c => ({ c, quiet: -daysFromToday(c.lastTouch || c.log[c.log.length-1].date) }))
      .filter(x => x.quiet >= FOLLOW_UP_DAYS)
      .sort((x, y) => y.quiet - x.quiet)[0];
    if (dueD) return { text: 'Follow-up ' + ((dueD.c.log||[]).length + 1) + ' of 3 — ' + dueD.c.name.split(' ')[0] + ', quiet ' + dueD.quiet + 'd', cls: 'due' };
    if (a.nextAction) {
      const n = a.nextActionDate ? daysFromToday(a.nextActionDate) : null;
      return { text: a.nextAction, cls: n !== null && n <= 0 ? 'due' : '', when: a.nextActionDate ? relDue(a.nextActionDate) : '' };
    }
    if (a.stage === 'applied' && a.dateApplied) {
      const q = -daysFromToday(a.dateApplied);
      if (q >= STALE_APP_DAYS) return { text: 'Quiet ' + q + 'd — follow up or close it', cls: 'warn' };
    }
    return { text: 'Waiting', cls: 'muted' };
  }
  if (!r.human) return { text: 'Find one person — peer in the role', cls: 'warn' };
  if (!r.sent) return { text: 'Send the first message', cls: '' };

  // follow-up engine: the highest-evidence tactic available, capped at 3
  const due = r.people
    .filter(c => (c.log || []).length && (c.log || []).length < MAX_TOUCHES && !['replied','call_booked','met'].includes(c.status))
    .map(c => ({ c, quiet: -daysFromToday(c.lastTouch || c.log[c.log.length-1].date) }))
    .filter(x => x.quiet >= FOLLOW_UP_DAYS)
    .sort((x, y) => y.quiet - x.quiet)[0];
  if (due) return { text: 'Follow-up ' + ((due.c.log||[]).length + 1) + ' of 3 — ' + due.c.name.split(' ')[0] + ', quiet ' + due.quiet + 'd', cls: 'due' };

  if (a.nextAction) {
    const n = a.nextActionDate ? daysFromToday(a.nextActionDate) : null;
    return { text: a.nextAction, cls: n !== null && n <= 0 ? 'due' : '', when: a.nextActionDate ? relDue(a.nextActionDate) : '' };
  }
  if (!r.applied) {
    const wk = weeksSincePosted(a);
    if (wk !== null && wk < 1) return { text: 'Apply in a few days — week-1 pile is 2.5–3x deeper', cls: 'warn' };
    return { text: 'Apply', cls: '' };
  }
  if (r.people.every(c => (c.log||[]).length >= MAX_TOUCHES) && !r.talked)
    return { text: 'Three touches done — stop, or find someone else', cls: 'muted' };
  if (a.stage === 'applied' && a.dateApplied) {
    const q = -daysFromToday(a.dateApplied);
    if (q >= STALE_APP_DAYS) return { text: 'Quiet ' + q + 'd — nudge a human or close it', cls: 'warn' };
  }
  return { text: 'Waiting', cls: 'muted' };
}

/* Ashby (93K jobs): a posting's first week draws 2.5–3x the applications of any
   later week. Applying in week 2+ is a thinner pile for identical effort. */
function weeksSincePosted(a) {
  if (!a.datePosted) return null;
  const d = -daysFromToday(a.datePosted);
  return d / 7;
}

function readyDots(a) {
  const r = readiness(a), st = stepsFor(a);
  return '<span class="dots" title="' + st.map(s => (r[s.k] ? '✓ ' : '· ') + s.lab).join('\n') + (a.approach === 'direct' ? '\n(direct route)' : '') + '">' +
    st.map(s => '<i class="' + (r[s.k] ? 'on' : '') + '"></i>').join('') + '</span>';
}

function viewRoles() {
  const f = roleFilters;
  const list = filteredApps();
  const total = state.applications.length;
  const noHuman = state.applications.filter(a => isActive(a) && a.approach !== 'direct' && !roleContacts(a.id).length).length;
  const chip = (label, on, action, val) =>
    '<button class="chip' + (on ? ' on' : '') + '" data-action="' + action + '" data-val="' + val + '">' + label + '</button>';

  const bar = '<div class="sheet-bar">' +
    '<input type="search" id="app-q" placeholder="Search company, role, your angle…" value="' + esc(f.q) + '">' +
    '<div class="spacer"></div>' +
    '<span class="sheet-count">' + list.length + ' of ' + total + '</span>' +
    '</div>' +
    '<div class="chips sheet-chips">' +
      chip('Active', f.stage === 'active', 'fstage', 'active') +
      chip('All', f.stage === '', 'fstage', '') +
      chip('Closed', f.stage === 'closed', 'fstage', 'closed') +
      '<span class="chip-div"></span>' +
      chip('★ ' + FOCUS_MARKET, f.market === '__focus', 'fmarket', '__focus') +
      chip('Everywhere', f.market === '', 'fmarket', '') +
      '<span class="chip-div"></span>' +
      chip('High priority', f.priority === 'high', 'fprio', 'high') +
      chip('No human yet' + (noHuman ? ' · ' + noHuman : ''), f.cold, 'fcold', '1') +
    '</div>';

  const bulk = selectedApps.size
    ? '<div class="bulkbar"><strong>' + selectedApps.size + ' selected</strong>' +
        '<select id="bulk-stage"><option value="">Move to stage…</option>' +
          ALL_STAGES.map(s => '<option value="' + s.id + '">' + s.label + '</option>').join('') + '</select>' +
        '<select id="bulk-market"><option value="">Set market…</option>' +
          MARKETS.map(m => '<option>' + m + '</option>').join('') + '</select>' +
        '<button class="btn sm" data-action="bulk-clear">Clear</button>' +
        '<button class="btn sm danger" data-action="bulk-del">Delete</button>' +
      '</div>' : '';

  return '<div class="sheet-page">' + bar + sheetHTML(list) + bulk + '</div>';
}

const SHEET_COLS = [
  { k: 'company',  lab: 'Company',   w: 150, type: 'text' },
  { k: 'role',     lab: 'Role',      w: 208, type: 'text' },
  { k: 'stage',    lab: 'Stage',     w: 134, type: 'stage' },
  { k: 'ready',    lab: 'Ready',     w: 78,  type: 'derived' },
  { k: 'people',   lab: 'People',    w: 68,  type: 'derived' },
  { k: 'priority', lab: 'Priority',  w: 96,  type: 'enum', opts: ['high','med','low'] },
  { k: 'market',   lab: 'Market',    w: 156, type: 'enum', optsFn: () => MARKETS },
  { k: 'nextMove', lab: 'Next move', w: 258, type: 'derived' },
];

function sheetHTML(list) {
  const head = '<tr><th class="c-sel"><input type="checkbox" data-action="sel-all"' +
      (list.length && list.every(a => selectedApps.has(a.id)) ? ' checked' : '') + '></th>' +
    SHEET_COLS.map((c, i) => '<th style="min-width:' + c.w + 'px;width:' + c.w + 'px"' +
      ' class="' + (i === 0 ? 'c-first ' : '') + (c.k === 'people' || c.k === 'nextMove' ? '' : 'sortable') + '"' +
      (c.k === 'people' || c.k === 'nextMove' ? '' : ' data-action="sort" data-key="' + c.k + '"') + '>' +
      '<span class="th-in">' + c.lab +
        (tableSort.key === c.k ? '<span class="arr">' + (tableSort.dir === 1 ? '↑' : '↓') + '</span>' : '') +
      '</span></th>').join('') + '<th class="c-open"></th></tr>';

  const rows = list.map(a => {
    const nm = nextMove(a);
    const people = roleContacts(a.id).length;
    const cells = SHEET_COLS.map((c, ci) => {
      const first = ci === 0 ? ' c-first' : '';
      if (c.k === 'ready') return '<td class="c-ready" data-action="open-role" data-id="' + a.id + '">' + readyDots(a) + '</td>';
      if (c.k === 'people') return '<td class="c-people' + (people ? '' : ' none') + '" data-action="open-role" data-id="' + a.id + '">' + (people || '—') + '</td>';
      if (c.k === 'nextMove') return '<td class="c-next ' + nm.cls + '" data-action="open-role" data-id="' + a.id + '">' + esc(nm.text) +
        (nm.when ? ' <span class="nm-when">' + nm.when + '</span>' : '') + '</td>';
      if (c.type === 'stage') {
        return '<td class="c-in"><select class="cell-in stage-in" data-cell="stage" data-id="' + a.id + '">' +
          ALL_STAGES.map(x => '<option value="' + x.id + '"' + (x.id === a.stage ? ' selected' : '') + '>' + x.label + '</option>').join('') +
          '</select></td>';
      }
      if (c.type === 'enum') {
        const opts = c.opts || c.optsFn();
        const labels = { high: 'High', med: 'Medium', low: 'Low' };
        return '<td class="c-in"><select class="cell-in" data-cell="' + c.k + '" data-id="' + a.id + '">' +
          (c.k === 'market' ? '<option value=""></option>' : '') +
          opts.map(o => '<option value="' + esc(o) + '"' + (o === a[c.k] ? ' selected' : '') + '>' + esc(labels[o] || o) + '</option>').join('') +
          '</select></td>';
      }
      return '<td class="c-in' + first + '"><input class="cell-in' + (!a[c.k] ? ' is-blank' : '') + '" type="text" data-cell="' + c.k +
        '" data-id="' + a.id + '" value="' + esc(a[c.k] || '') + '" placeholder="—"></td>';
    }).join('');
    return '<tr class="' + (isActive(a) ? '' : 'closed ') + (selectedApps.has(a.id) ? 'sel ' : '') + (openRoleId === a.id ? 'open' : '') + '">' +
      '<td class="c-sel"><input type="checkbox" data-action="sel-row" data-id="' + a.id + '"' + (selectedApps.has(a.id) ? ' checked' : '') + '></td>' +
      cells +
      '<td class="c-open"><button class="chev-open" data-action="open-role" data-id="' + a.id + '" title="Open">›</button></td></tr>';
  }).join('');

  const ready = list.filter(a => readyCount(a) === 4).length;
  return '<div class="sheet-wrap"><table class="sheet"><thead>' + head + '</thead><tbody>' +
    (rows || '<tr class="norows"><td colspan="' + (SHEET_COLS.length + 2) + '"><div class="empty">' +
      (state.applications.length ? 'Nothing matches these filters.' : 'No roles yet. ＋ New → Role. One is enough to start.') +
      '</div></td></tr>') +
    '</tbody></table></div>' +
    '<div class="sheet-foot">' +
      '<span>' + list.length + ' row' + (list.length === 1 ? '' : 's') + (ready ? ' · ' + ready + ' fully ready' : '') + '</span>' +
      '<span class="sf-hint">Type in any cell · Enter moves down · click a row to open it</span>' +
    '</div>';
}

function commitCell(id, field, value) {
  const a = state.applications.find(x => x.id === id);
  if (!a) return;
  const v = String(value).trim();
  if ((a[field] || '') === v) return;
  a[field] = v;
  if (field === 'stage') {
    if (v === 'applied' && !a.dateApplied) a.dateApplied = todayISO();
    (a.log = a.log || []).push({ date: todayISO(), text: 'Stage → ' + stageById(v).label });
  }
  markDirty();
}

/* ================================================================
   The drawer — the whole flow for one role, in order
   ================================================================ */
function renderDrawer() {
  const host = document.getElementById('drawer-host');
  const a = openRoleId ? state.applications.find(x => x.id === openRoleId) : null;
  if (!a) { host.className = 'drawer-host'; host.innerHTML = ''; return; }
  host.className = 'drawer-host open';
  host.innerHTML = drawerHTML(a);
}

/* ONE prompt, shown at write-time, asking for a FACT about them — not an
   aspiration about you. Two reasons for this shape:
   · Verbeke et al. 2011 (k=268, N=79,747 salespeople): selling-related KNOWLEDGE
     is the top predictor of performance (β=.28); role ambiguity is the worst
     drag (β=−.25). Knowing the thing helps. Wanting the thing does not.
   · Scheibehenne et al. 2010: adding a justification requirement dropped action
     from 88% to 72%. "Why you specifically" IS a justification requirement. */
const PROMPTS = {
  hook: 'One fact you could only know by looking — something they shipped, posted, or measured. This becomes line one of your message. Nothing more is required.',
};

function drawerHTML(a) {
  const r = readiness(a);
  const people = r.people;
  const variants = (state.resume.variants || []).filter(v => v.appId === a.id);

  const direct = a.approach === 'direct';
  const steps = '<div class="ready-rail">' + stepsFor(a).map((s, i) =>
    '<div class="rstep' + (r[s.k] ? ' on' : '') + '"><i>' + (r[s.k] ? '✓' : i + 1) + '</i><span>' + s.lab + '</span></div>').join('') +
    '<div class="appr-seg" title="Warm: find a person first (referrals convert ~30x). Direct: straight application (still 52% of startup hires).">' +
      '<button class="chip' + (direct ? '' : ' on') + '" data-action="set-approach" data-id="' + a.id + '" data-val="warm">Warm intro</button>' +
      '<button class="chip' + (direct ? ' on' : '') + '" data-action="set-approach" data-id="' + a.id + '" data-val="direct">Direct apply</button>' +
    '</div>' +
  '</div>';   // closes .ready-rail — its absence nested the whole drawer body inside the flex rail

  const fieldBox = (key, label) =>
    '<div class="dfield">' +
      '<label>' + label + '</label>' +
      '<div class="dprompt">' + PROMPTS[key] + '</div>' +
      '<textarea class="drawer-in" data-dcell="' + key + '" data-id="' + a.id + '" rows="2" placeholder="…">' + esc(a[key] || '') + '</textarea>' +
    '</div>';
  const touches = touchCount(a);
  const capped = touches >= MAX_TOUCHES;

  const peopleRows = people.length ? people.map(c => {
    const st = contactStatusById(c.status);
    const quiet = c.lastTouch ? -daysFromToday(c.lastTouch) : null;
    return '<div class="prow">' +
      '<div class="p-main"><span class="p-name">' + esc(c.name) + '</span>' +
        '<span class="p-title">' + esc(c.title || '') + '</span></div>' +
      '<div class="p-meta">' +
        '<span class="pill route r' + ROUTES.indexOf(c.route) + '">' + esc(c.route || 'Cold') + '</span>' +
        '<span class="pill"><span class="swatch" style="background:' + st.color + '"></span>' + st.label + '</span>' +
        (quiet !== null ? '<span class="p-quiet' + (quiet >= FOLLOW_UP_DAYS && c.status === 'reached_out' ? ' due' : '') + '">' + quiet + 'd ago</span>' : '') +
        (c.linkedin ? '<a class="pill" href="' + esc(c.linkedin) + '" target="_blank" rel="noopener">in</a>' : '') +
        (c.email ? '<a class="pill" href="mailto:' + esc(c.email) + '">email</a>' : '') +
      '</div>' +
      '<div class="p-act">' +
        '<button class="btn sm" data-action="log-touch" data-id="' + c.id + '">Log touch</button>' +
        '<button class="rmini" data-action="edit-person" data-id="' + c.id + '">edit</button>' +
      '</div></div>';
  }).join('') : '<div class="dhint">Nobody yet. This is the step that decides whether the application matters.</div>';

  const hints = '<div class="routehints">' + ROUTES.map(rt =>
    '<div class="rh"><b>' + rt + '</b><span>' + ROUTE_HINTS[rt] + '</span></div>').join('') + '</div>';

  const words = (a.draft || '').trim().split(/\s+/).filter(Boolean).length;
  const draft = '<textarea class="drawer-in" data-dcell="draft" data-id="' + a.id + '" rows="6" placeholder="The message you are about to send…">' + esc(a.draft || '') + '</textarea>' +
    '<div class="drow">' +
      '<button class="btn sm primary" data-action="seed-draft" data-id="' + a.id + '">Write it for me</button>' +
      (words ? '<span class="wordpill' + (words > 120 ? ' long' : '') + '">' + words + ' words</span>' : '') +
      (capped
        ? '<span class="dhint" style="margin:0;color:var(--serious);font-weight:600">Three touches sent. A fourth returns 4.5% of replies and costs goodwill. Find someone else.</span>'
        : '<button class="btn sm" data-action="mark-sent" data-id="' + a.id + '">I sent it →</button>') +
    '</div>' +
    '<div class="drow" style="margin-top:8px"><span class="dlab" style="min-width:auto">Add proof:</span>' +
      state.stories.filter(s => s.result || s.body).slice(0, 7).map(s =>
        '<button class="chip" data-action="insert-story" data-id="' + s.id + '" title="' + esc(storyLine(s)) + '">' + esc(s.title.split(' — ')[0].slice(0, 22)) + '</button>').join('') +
    '</div>' +
    '<div class="evnote">Shorter asks beat longer ones — Cochrane meta-analysis, questionnaire response: <b>shortening the ask OR 1.73</b>, following up <b>OR 1.35</b>, personalising <b>OR 1.24</b>. Personalisation is the <i>weakest</i> of the three. Under 120 words.</div>';

  const applyBlock =
    '<div class="drow">' +
      '<label class="dlab">Resume variant</label>' +
      '<select class="drawer-in sel" data-dcell="variantId" data-id="' + a.id + '">' +
        '<option value="">— none yet —</option>' +
        (state.resume.variants || []).map(v => '<option value="' + v.id + '"' + (a.variantId === v.id ? ' selected' : '') + '>' + esc(v.name) + '</option>').join('') +
      '</select>' +
      (variants.length ? '' : '<button class="btn sm" data-action="tailor-for" data-id="' + a.id + '">Tailor one</button>') +
    '</div>' +
    '<div class="drow">' +
      '<label class="dlab">Date applied</label>' +
      '<input class="drawer-in sel" type="date" data-dcell="dateApplied" data-id="' + a.id + '" value="' + esc(a.dateApplied || '') + '">' +
    '</div>' +
    (!direct && !r.human && !r.applied ? '<div class="dwarn">You have no human here. Applying now puts you in the pile — or switch this role to the direct route above and the app stops asking.</div>' : '');

  const nextAction =
    '<div class="drow">' +
      '<input class="drawer-in" data-dcell="nextAction" data-id="' + a.id + '" value="' + esc(a.nextAction || '') + '" placeholder="Anything the app has not already told you to do">' +
      '<input class="drawer-in sel" type="date" data-dcell="nextActionDate" data-id="' + a.id + '" value="' + esc(a.nextActionDate || '') + '">' +
    '</div>' +
    '<div class="evnote">A reminder, not a deadline. Ariely &amp; Wertenbroch\'s evenly-spaced-deadline result <b>failed direct replication in 2026</b> (Hyndman &amp; Bisin, <i>Psych Science</i>, N=120, all F &lt; 1.2), and in a larger field experiment self-imposed deadlines produced <b>fewer</b> completions than no deadline at all (36.8% vs 47.0%). Nothing here nags you.</div>';

  const log = (a.log || []).length
    ? '<div class="dlog">' + a.log.slice().reverse().slice(0, 8).map(l =>
        '<div class="dlog-i"><span>' + fmtDate(l.date) + '</span>' + esc(l.text) + '</div>').join('') + '</div>'
    : '';

  return '<div class="drawer">' +
    '<div class="dhead">' +
      '<div><div class="dh-co">' + esc(a.company) + '</div><div class="dh-role">' + esc(a.role) + '</div></div>' +
      '<div class="dh-act">' +
        (a.jdUrl ? '<a class="btn sm" href="' + esc(a.jdUrl) + '" target="_blank" rel="noopener">Job ad</a>' : '') +
        '<button class="btn sm" data-action="edit-role-meta" data-id="' + a.id + '">Details</button>' +
        '<button class="orb dclose" data-action="close-drawer">✕</button>' +
      '</div>' +
    '</div>' +
    steps +
    '<div class="dbody">' +
    (direct
      ? (function () {
          /* Direct means "no outreach REQUIRED to apply" — not "no outreach
             ever". The real motion is: apply cold, then chase a person.
             One prompt, once per role, only after Applied. */
          const isApplied = r.applied || ['applied', 'screen', 'interview', 'offer', 'accepted'].includes(a.stage);
          const showOutreach = people.length > 0 || a.postApplyOutreach === 'accepted';
          const prompt = (!showOutreach && isApplied && a.postApplyOutreach === 'unseen')
            ? '<div class="pap">' +
                '<div class="pap-t">Applied cold. Want to find someone here?</div>' +
                '<div class="pap-s">A short note to one person after applying still beats the pile — referrals convert ~30x per application, and it takes one name. The application stands either way.</div>' +
                '<div class="drow" style="margin-top:8px">' +
                  '<button class="btn sm primary" data-action="post-apply-accept" data-id="' + a.id + '">＋ Find someone</button>' +
                  '<button class="btn sm ghost" data-action="post-apply-dismiss" data-id="' + a.id + '">Not for this one</button>' +
                '</div>' +
              '</div>'
            : '';
          const outreach = showOutreach
            ? '<section><h4>People<button class="btn sm" data-action="add-person" data-id="' + a.id + '">+ Person</button></h4>' +
                peopleRows +
                '<details class="dwhere"><summary>Where to look — and why these five, in this order</summary>' + hints + '</details>' +
              '</section>' +
              '<section><h4>Send it' +
                '<span class="touchpill' + (capped ? ' capped' : '') + '">' + touches + ' / 3 touches</span></h4>' +
                fieldBox('hook', 'Your hook') + draft + '</section>'
            : '';
          return '<section><h4>1 · Apply</h4>' + applyBlock + '</section>' +
            prompt + outreach +
            '<section><h4>Next move</h4>' + nextAction + log + '</section>' +
            (showOutreach || isApplied ? ''
              : '<div class="dhint" style="margin:2px 4px 8px">Direct route — nothing to do here but apply. After you apply, the app will ask once whether you want to chase a person too.</div>');
        })()
      : '<section><h4>1 · Find a person<button class="btn sm" data-action="add-person" data-id="' + a.id + '">+ Person</button></h4>' +
        peopleRows +
        '<details class="dwhere"><summary>Where to look — and why these five, in this order</summary>' + hints + '</details>' +
      '</section>' +
      '<section><h4>2 · Send it' +
        '<span class="touchpill' + (capped ? ' capped' : '') + '">' + touches + ' / 3 touches</span></h4>' +
        fieldBox('hook', 'Your hook') + draft + '</section>' +
      '<section><h4>3 · Apply</h4>' + applyBlock + '</section>' +
      '<section><h4>Next move</h4>' + nextAction + log + '</section>') +
    '</div></div>';
}

/* A first draft you edit, not a message you send. Shape follows the evidence:
   short (Cochrane OR 1.73), one specific fact about them, a low-cost ask for
   ten to fifteen minutes (Milkman 2015: 67% replies to exactly this shape). */
function seedDraft(a) {
  const person = roleContacts(a.id)[0];
  const who = person ? person.name.split(' ')[0] : '[Name]';
  const hook = (a.hook || '').trim();
  const st = state.stories.find(s => (s.themes || []).includes('product')) || state.stories[0];
  const role = (a.role || '').trim();
  const lines = [
    'Hi ' + who + ' —',
    '',
    hook || '[One fact about ' + a.company + ' you could only know by looking.]',
    '',
    'I\'m an analyst at Deloitte in Brisbane moving into product.',
    '',
    'Not asking for a referral. I\'d just like fifteen minutes on what the ' +
      (role ? role + ' job' : 'job') + ' is actually like day to day.',
  ];
  a.draft = lines.join('\n');
  markDirty(); render();
  toast(st ? 'Draft ready — swap in a story if it earns its place' : 'Draft ready — send it');
}

/* One click = the behaviour is recorded. Harkin: recorded monitoring d+ 0.43
   vs unrecorded 0.29, and behaviour→behaviour is the only pairing that works. */
function markSent(a) {
  const people = roleContacts(a.id);
  if (!people.length) { toast('Add a person first'); return; }
  const c = people.find(x => (x.log || []).length < MAX_TOUCHES) || people[0];
  if ((c.log || []).length >= MAX_TOUCHES) { toast('Three touches already sent to ' + c.name); return; }
  (c.log = c.log || []).push({ date: todayISO(), channel: 'LinkedIn DM', text: (c.log||[]).length ? 'Follow-up ' + ((c.log||[]).length) : 'First message sent' });
  c.lastTouch = todayISO();
  if (c.status === 'identified') c.status = 'reached_out';
  markDirty(); render();
  toast('Logged — touch ' + c.log.length + ' of 3 to ' + c.name.split(' ')[0]);
}

function personForm(cid, appId) {
  const c = cid ? state.contacts.find(x => x.id === cid) : null;
  openModal(

      field('Name *', inp('name', c && c.name, 'required')) +
      field('Title', inp('title', c && c.title, 'placeholder="Associate PM"')) +
      field('Route in', sel('route', ROUTES, c ? c.route : 'Peer in the role')) +
      field('Status', sel('status', CONTACT_STATUSES.map(s => [s.id, s.label]), c ? c.status : 'identified')) +
      field('LinkedIn', inp('linkedin', c && c.linkedin, 'type="url"')) +
      field('Email', inp('email', c && c.email, 'type="email"')) +
      field('Last touch', inp('lastTouch', c && c.lastTouch, 'type="date"')) +
      field('Next follow-up', inp('nextFollowUp', c && c.nextFollowUp, 'type="date"')) +
      '<div class="full">' + field('Notes', '<textarea name="notes">' + esc(c && c.notes || '') + '</textarea>') + '</div>' +
    '</div><div class="modal-foot">' +
      (c ? '<button type="button" class="btn danger left" data-action="del-person" data-id="' + c.id + '">Delete</button>' : '') +
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
      '<button type="submit" class="btn primary">Save</button>' +
    '</div></form>',
    fd => {
      const o = c || { id: uid('con'), appId: appId || openRoleId, log: [] };

      if (!c) state.contacts.push(o);
      closeModal(); toast(c ? 'Saved' : o.name + ' added'); markDirty(); render();
    });
}

function logTouchForm(cid) {
  const c = state.contacts.find(x => x.id === cid);
  if (!c) return;
  openModal(
    '<h3>Log a touch · ' + esc(c.name) + '<button class="x" data-action="close-modal">✕</button></h3>' +
    '<form><div class="fgrid">' +
      field('Channel', sel('channel', CHANNELS, 'LinkedIn DM')) +
      field('Date', inp('date', todayISO(), 'type="date"')) +
      field('New status', sel('status', CONTACT_STATUSES.map(s => [s.id, s.label]), c.status)) +
      field('Next follow-up', inp('nextFollowUp', c.nextFollowUp, 'type="date"')) +
      '<div class="full">' + field('What happened', '<textarea name="text" placeholder="Sent the DM referencing their post on…"></textarea>') + '</div>' +
    '</div><div class="modal-foot">' +
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
      '<button type="submit" class="btn primary">Log it</button>' +
    '</div></form>',
    fd => {
      const date = String(fd.get('date') || todayISO());
      (c.log = c.log || []).push({ date, channel: String(fd.get('channel')), text: String(fd.get('text') || '').trim() || 'Touch logged' });
      c.status = String(fd.get('status'));
      c.lastTouch = date;
      c.nextFollowUp = String(fd.get('nextFollowUp') || '');
      closeModal(); toast('Logged'); markDirty(); render();
    });
}

   Settings & sync — reference material lives here, not the dashboard

    : '<div class="sync-banner clean">✓ No changes since ' + (s.meta.lastSynced ? 'last sync' : 'this version was generated') + '.</div>';
  return '<div class="content-inner">' + banner +
    '<div class="card panel"><div class="section-title">Weekly target' +

    '</div>' +
    '<div class="sync-cols" style="margin-top:16px">' +
      '<div class="card panel"><div class="section-title">Export → Claude</div>' +

function openModal(html, onSubmit, wide) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.id = 'modal-back';
  back.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div>';
  document.body.appendChild(back);
  back.addEventListener('mousedown', e => { if (e.target === back) closeModal(); });
  const form = back.querySelector('form');
  if (form && onSubmit) form.addEventListener('submit', e => { e.preventDefault(); onSubmit(new FormData(form), form); });
  const first = back.querySelector('input,textarea,select');
  if (first) first.focus();
}
function closeModal() { const m = $('#modal-back'); if (m) m.remove(); }
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); if (done) done(); }
  catch (e) { toast('Copy failed — select the text and copy manually'); }
  document.body.removeChild(ta);
}
const field = (label, inner) => '<div class="field"><label>' + label + '</label>' + inner + '</div>';
const inp = (name, val, attrs) => '<input name="' + name + '" value="' + esc(val || '') + '" ' + (attrs || '') + '>';
const sel = (name, opts, val) => '<select name="' + name + '">' + opts.map(o => {
  const [v, l] = Array.isArray(o) ? o : [o, o];
  return '<option value="' + esc(v) + '"' + (v === val ? ' selected' : '') + '>' + esc(l) + '</option>';
}).join('') + '</select>';

/* Paste-a-job-ad parser. Heuristics, reviewed by the user before saving —
   recognition over recall: reading a prefilled form and correcting it is far
   cheaper than recalling and typing every field. All best-effort regex; the
   form stays fully editable. */
function parseJobAd(text) {
  const out = {};
  const t = String(text || '').trim();
  if (!t) return out;
  const urlM = t.match(/https?:\/\/[^\s"'<>]+/);
  if (urlM) {
    out.jdUrl = urlM[0].replace(/[).,]+$/, '');
    const host = (out.jdUrl.match(/\/\/(?:www\.)?([^\/]+)/) || [])[1] || '';
    if (/seek\.com/.test(host)) out.source = 'SEEK';
    else if (/linkedin\.com/.test(host)) out.source = 'LinkedIn';
    else if (/indeed\./.test(host)) out.source = 'Indeed';
    else if (/greenhouse\.io|lever\.co|workable\.com|ashbyhq\.com|smartrecruiters\.com|jobs\./.test(host)) out.source = 'Company site';
    const slug = out.jdUrl.match(/(?:boards\.greenhouse\.io|jobs\.lever\.co|jobs\.ashbyhq\.com)\/([A-Za-z0-9-_]+)/);
    if (slug) out.company = slug[1].replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }
  const lines = t.split(/\n+/).map(x => x.trim()).filter(x => x && !/^https?:\/\//.test(x));
  const TITLE_RE = /(manager|engineer|analyst|associate|director|designer|coordinator|lead|specialist|consultant|officer|developer|scientist|producer|marketer|intern|graduate|representative|executive|head of)/i;
  const ti = lines.findIndex(l => l.length < 90 && TITLE_RE.test(l));
  if (ti > -1) {
    let title = lines[ti];
    const atM = title.match(/^(.*?)\s+(?:at|@)\s+([A-Z][\w&.'\- ]{1,40})$/);
    if (atM) { title = atM[1]; out.company = out.company || atM[2].trim(); }
    out.role = title.replace(/\s*[-–—|•·]\s*$/, '').trim();
    // job-board layout: the line after the title is often "Company · Location"
    const after = lines[ti + 1] || '';
    if (!out.company && /[·•|]/.test(after)) out.company = after.split(/[·•|]/)[0].trim();
    else if (!out.company && after.length < 45 && /^[A-Z]/.test(after) && !TITLE_RE.test(after) && !/\d/.test(after)) out.company = after.trim();
  }
  let m = t.match(/^Company:\s*(.+)$/mi);
  if (m) out.company = m[1].trim();
  const locM = t.match(/(Sydney|Melbourne|Brisbane|Perth|Adelaide|Canberra|Gold Coast|Hobart|Darwin|Auckland|Wellington|New York|San Francisco|Los Angeles|Austin|Seattle|Boston|Chicago|Denver|Miami|London|Berlin|Dublin|Amsterdam|Paris|Singapore|Remote)(?:[ ,]{1,2}(?:[A-Z]{2,3}|[A-Z][a-z]+)){0,2}/);
  if (locM) out.location = locM[0].replace(/[ ,]+$/, '').trim();
  const salM = t.match(/\$\s?\d{2,3}(?:,\d{3})?(?:\s?[kK])?(?:\s?[-–—]\s?\$?\s?\d{2,3}(?:,\d{3})?(?:\s?[kK])?)?(?:\s*(?:per annum|p\.?a\.?|\+\s*super(?:annuation)?))?/);
  if (salM) out.salary = salM[0].replace(/\s+/g, ' ').trim();
  m = t.match(/[Pp]osted\s+(\d+)\+?\s*(day|week|hour)s?\s+ago/);
  if (m) {
    const nn = +m[1];
    out.datePosted = isoPlus(m[2] === 'week' ? -nn * 7 : m[2] === 'day' ? -nn : 0);
  } else if (/[Pp]osted\s+today|[Jj]ust posted/.test(t)) out.datePosted = todayISO();
  if (out.location) {
    const l = out.location.toLowerCase();
    if (/sydney|melbourne/.test(l)) out.market = 'Sydney / Melbourne';
    else if (/brisbane|remote/.test(l)) out.market = 'Brisbane / Remote AU';
    else if (/new york|san francisco|los angeles|austin|seattle|boston|chicago|denver|miami/.test(l)) out.market = 'United States';
    else if (/london|berlin|dublin|amsterdam|paris/.test(l)) out.market = 'UK / Europe';
  }
  if (out.role) {
    const rl = out.role.toLowerCase();
    if (/product/.test(rl)) out.roleType = 'Product / APM';
    else if (/growth|marketing|gtm/.test(rl)) out.roleType = 'Growth / GTM';
    else if (/sales|sdr|business development/.test(rl)) out.roleType = 'SDR / BD';
    else if (/operations|chief of staff|bizops/.test(rl)) out.roleType = 'BizOps / Chief of Staff';
  }
  Object.keys(out).forEach(k => { if (!out[k]) delete out[k]; });
  return out;
}

/* Doc form */
function exportJSON() { return JSON.stringify(state, null, 2); }
function doCopySync() {
  const data = exportJSON();
  const area = $('#export-area');
  if (area) area.value = data;
  state.meta.lastSynced = new Date().toISOString();
  const done = ok => {
    unsyncedChanges = 0;
    toast(ok ? 'Copied — paste it to Claude in the project chat' : 'Clipboard blocked — select the text below and copy manually');
    render();
    const a2 = $('#export-area'); if (a2) { a2.value = data; if (!ok) { a2.focus(); a2.select(); } }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(data).then(() => done(true)).catch(() => done(false));
  } else done(false);
}
function doDownload() {
  const blob = new Blob([exportJSON()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'job-search-hq-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);

}
function doImport(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { toast('That isn’t valid JSON — check the paste'); return; }

document.addEventListener('input', e => {

document.addEventListener('change', e => {

  if (t.id === 'bulk-stage' && t.value) {

    selectedApps.forEach(id => commitCell(id, 'market', t.value));

  }
  // inline sheet cells: selects commit immediately
  if (t.classList.contains('cell-in') && t.tagName === 'SELECT') {
    commitCell(t.dataset.id, t.dataset.cell, t.value);
    refreshSheet(); return;
  }
  if (t.classList.contains('drawer-in') && (t.tagName === 'SELECT' || t.type === 'date')) { commitDrawer(t); return; }
  if (t.id === 'import-file') {
    const f = t.files[0];
    if (f) { const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(f); }

});
// spreadsheet behaviour: focusing a text cell selects it, so typing overwrites
const isTextCell = t => t && t.classList && t.classList.contains('cell-in') && t.tagName === 'INPUT' && t.type === 'text';
document.addEventListener('focusin', e => { if (isTextCell(e.target)) { try { e.target.select(); } catch (err) {} } });
// stop the click's caret placement from collapsing that selection
document.addEventListener('mouseup', e => { if (isTextCell(e.target) && e.target.selectionStart === e.target.selectionEnd && document.activeElement === e.target) return; if (isTextCell(e.target)) e.preventDefault(); }, true);
// text/date cells commit on blur
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('cell-in') && t.tagName === 'INPUT') {
    commitCell(t.dataset.id, t.dataset.cell, t.value);
  }
  // drawer fields autosave — no save button anywhere in this app
  if (t.classList && t.classList.contains('drawer-in')) commitDrawer(t);
});
function commitDrawer(t) {
  const a = state.applications.find(x => x.id === t.dataset.id);
  if (!a) return;
  const k = t.dataset.dcell, v = t.value;
  if ((a[k] || '') === v) return;
  a[k] = v;
  if (k === 'dateApplied' && v && a.stage === 'research') a.stage = 'applied';
  markDirty();
  // readiness/next-move may have changed — repaint sheet + rail, keep focus
  const key = { id: t.dataset.id, cell: k };
  render();
  const back = document.querySelector('.drawer-in[data-id="' + key.id + '"][data-dcell="' + key.cell + '"]');
  if (back && document.activeElement !== back) { /* leave focus alone, user moved on */ }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); if (e.target.classList && e.target.classList.contains('cell-in')) e.target.blur(); }
  const t = e.target;
  if (t.classList && t.classList.contains('cell-in') && (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    if (e.key === 'Enter' && t.tagName === 'INPUT') commitCell(t.dataset.id, t.dataset.cell, t.value);
    e.preventDefault();
    const col = t.dataset.cell;
    const all = Array.from(document.querySelectorAll('.cell-in[data-cell="' + col + '"]'));
    const i = all.indexOf(t);
    const next = all[i + (e.key === 'ArrowUp' ? -1 : 1)];
    if (next) { next.focus(); if (next.select) try { next.select(); } catch (err) {} }
    else t.blur();
  }
});

/* Re-render the sheet without losing the cell you're typing in. */
function refreshSheet() {
  const el = document.activeElement;
  const key = el && el.classList && el.classList.contains('cell-in')
    ? { id: el.dataset.id, cell: el.dataset.cell } : null;
  const q = el && el.id === 'app-q' ? el.selectionStart : null;
  render();
  if (key) {
    const back = document.querySelector('.cell-in[data-id="' + key.id + '"][data-cell="' + key.cell + '"]');
    if (back) back.focus();
  } else if (q !== null) {
    const s = document.getElementById('app-q');
    if (s) { s.focus(); try { s.setSelectionRange(q, q); } catch (err) {} }
  }
}

/* Debounced-ish body refresh that preserves search focus */
function refreshBody() {
  const focused = document.activeElement && document.activeElement.id;
  const pos = focused ? document.activeElement.selectionStart : null;
  render();
  if (focused) {
    const el = document.getElementById(focused);
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
  }
}



/* ================================================================
   Resume — master bullet library + per-application tailored variants
   ================================================================ */
const RES_KINDS = { work: 'Experience', leadership: 'Leadership', education: 'Education', project: 'Projects' };
let resumeTab = 'master';          // 'master' | variant id
let resumeThemeFilter = '';

function resumeMaster() { return state.resume.master; }
function allRoleGroups() { return resumeMaster().roles.concat(resumeMaster().education); }
function findRole(id) { return allRoleGroups().find(r => r.id === id); }
function findBullet(id) {
  for (const r of allRoleGroups()) { const b = r.bullets.find(x => x.id === id); if (b) return { role: r, bullet: b }; }
  return null;
}
function resumeGaps() {
  const out = [];
  allRoleGroups().forEach(r => r.bullets.forEach(b => { if (b.needsInput) out.push({ role: r, bullet: b }); }));
  return out;
}
function variantById(id) { return (state.resume.variants || []).find(v => v.id === id); }
function activeVariant() { return resumeTab === 'master' ? null : variantById(resumeTab); }

/* which bullets/achievements/skills are included for the current tab */
function isPicked(v, kind, id) {
  if (!v) {   // master view: core flag decides
    if (kind === 'bullet') { const f = findBullet(id); return f ? f.bullet.core !== false : false; }
    if (kind === 'ach') { const a = resumeMaster().achievements.find(x => x.id === id); return a ? a.core !== false : false; }
    return true;
  }
  const map = kind === 'bullet' ? v.picks : kind === 'ach' ? v.achievementPicks : v.skillPicks;
  return !!(map && map[id]);
}
function togglePick(kind, id) {
  const v = activeVariant();
  if (!v) {   // editing the master's default set
    if (kind === 'bullet') { const f = findBullet(id); if (f) f.bullet.core = !(f.bullet.core !== false); }
    else if (kind === 'ach') { const a = resumeMaster().achievements.find(x => x.id === id); if (a) a.core = !(a.core !== false); }
    else { skillForm(id); return; }   // master view: click a skill to edit or delete it
  } else {
    const key = kind === 'bullet' ? 'picks' : kind === 'ach' ? 'achievementPicks' : 'skillPicks';
    v[key] = v[key] || {};
    if (v[key][id]) delete v[key][id]; else v[key][id] = true;
    v.updatedAt = todayISO();
  }
  markDirty(); refreshBody();
}

function countIncluded(v) {
  let n = 0;
  allRoleGroups().forEach(r => r.bullets.forEach(b => { if (isPicked(v, 'bullet', b.id)) n++; }));
  resumeMaster().achievements.forEach(a => { if (isPicked(v, 'ach', a.id)) n++; });
  return n;
}

    '</div>' +
    '<div class="spacer" style="flex:1"></div>' +
    '<span class="pill' + (included > 18 ? ' offmk' : ' focusmk') + '">' + included + ' items selected' + (included > 18 ? ' — likely over one page' : '') + '</span>' +
    '<button class="btn sm" data-action="res-preview">Preview & copy</button>' +
    '</div>';

  /* summary picker */
  const summaries = '<div class="card panel"><div class="section-title">Summary' +
      '<div class="flex-r"><button class="btn sm" data-action="res-add-summary">+ Summary</button></div></div>' +
    m.summaries.map(s => {
      const on = v ? v.summaryId === s.id : s.core !== false;
      return '<div class="rrow' + (on ? ' on' : '') + '">' +
        '<button class="rpick" data-action="res-pick-summary" data-id="' + s.id + '" title="Use this summary">' + (on ? '●' : '○') + '</button>' +
        '<div class="rbody"><div class="rlabel">' + esc(s.label) + themePills(s.themes) + '</div>' +
        '<div class="rtext">' + esc(s.text) + '</div></div>' +
        '<button class="rmini" data-action="res-edit-summary" data-id="' + s.id + '">edit</button>' +
      '</div>';
    }).join('') + '</div>';

  const roleBlock = (r, groupLabel) =>
    '<div class="card panel">' +
      '<div class="section-title">' + esc(r.org) +
        '<span style="font-weight:500;color:var(--muted);font-size:12px;margin-left:8px">' + esc(r.title) + '</span>' +
        '<div class="flex-r">' +
          '<span class="pill">' + esc(r.start) + ' – ' + esc(r.end) + '</span>' +
          '<button class="btn sm" data-action="res-add-bullet" data-role="' + r.id + '">+ Bullet</button>' +
          '<button class="btn sm" data-action="res-edit-role" data-id="' + r.id + '">Edit</button>' +
        '</div>' +
      '</div>' +
      (r.bullets.length
        ? r.bullets.map(b => {
            const on = isPicked(v, 'bullet', b.id);
            const hot = resumeThemeFilter && (b.themes || []).includes(resumeThemeFilter);
            return '<div class="rrow' + (on ? ' on' : '') + (hot ? ' hot' : '') + (b.needsInput ? ' gap' : '') + '">' +
              '<button class="rpick" data-action="res-toggle" data-kind="bullet" data-id="' + b.id + '">' + (on ? '✓' : '') + '</button>' +
              '<div class="rbody"><div class="rtext">' + esc(b.text) + '</div>' + themePills(b.themes) + '</div>' +
              '<button class="rmini" data-action="res-edit-bullet" data-id="' + b.id + '">edit</button>' +
            '</div>';
          }).join('')
        : '<div class="empty" style="padding:16px">No bullets yet.</div>') +
    '</div>';

  const work = m.roles.map(r => roleBlock(r)).join('');
  const edu = m.education.filter(r => r.bullets.length || r.id === 'e-qut').map(r => roleBlock(r)).join('');

  const achs = '<div class="card panel"><div class="section-title">Achievements' +
      '<div class="flex-r"><button class="btn sm" data-action="res-add-ach">+ Achievement</button></div></div>' +
    m.achievements.map(a => {
      const on = isPicked(v, 'ach', a.id);
      const hot = resumeThemeFilter && (a.themes || []).includes(resumeThemeFilter);
      return '<div class="rrow' + (on ? ' on' : '') + (hot ? ' hot' : '') + '">' +
        '<button class="rpick" data-action="res-toggle" data-kind="ach" data-id="' + a.id + '">' + (on ? '✓' : '') + '</button>' +
        '<div class="rbody"><div class="rtext">' + esc(a.text) + '</div>' + themePills(a.themes) + '</div>' +
        '<button class="rmini" data-action="res-edit-ach" data-id="' + a.id + '">edit</button>' +
      '</div>';
    }).join('') + '</div>';

  const skills = '<div class="card panel"><div class="section-title">Skills' +
      '<div class="flex-r"><button class="btn sm" data-action="res-add-skill">+ Skill</button></div></div>' +
    '<div class="skillwrap">' + m.skills.map(s => {
      const on = isPicked(v, 'skill', s.id);
      return '<button class="skillchip' + (on ? ' on' : '') + '" data-action="res-toggle" data-kind="skill" data-id="' + s.id + '" title="' + (v ? 'Include in this variant' : 'Always in master') + '">' +
        esc(s.text) + '</button>';
    }).join('') + '</div>' +
    (v ? '' : '<div style="font-size:11.5px;color:var(--muted);margin-top:8px">All skills sit in the master. Open a tailored variant to pick a subset.</div>') +
    '</div>';

  const notes = v && v.notes
    ? '<div class="card panel"><div class="section-title">Tailoring notes</div><div class="rtext">' + esc(v.notes) + '</div></div>'
    : '';

  return '<div class="res-shell">' + rail +
    '<div class="res-main"><div class="content-inner" style="max-width:1080px">' +
      gapBanner + header + themeChips + notes + summaries +
      '<div class="section-head">Experience</div>' + work +
      '<div class="section-head">Education</div>' + edu +
      achs + skills +
    '</div></div></div>';
}

function themePills(list) {
  if (!list || !list.length) return '';
  return '<div class="tpills">' + list.map(t =>
    '<span class="tpill' + (resumeThemeFilter === t ? ' on' : '') + '">' + esc(t) + '</span>').join('') + '</div>';
}

/* ---------- rendered plain-text resume ---------- */
function resumeText() {
  const m = resumeMaster(), v = activeVariant();
  const L = [];
  L.push(m.header.name.toUpperCase());
  L.push(v ? (v.headline || m.header.headline) : m.header.headline);
  L.push([m.header.location, m.header.email, m.header.phone].filter(Boolean).join('  |  '));
  L.push(m.header.links.map(l => l.label + ': ' + l.url).join('  |  '));
  const sum = v ? m.summaries.find(s => s.id === v.summaryId) : m.summaries.find(s => s.core !== false);
  if (sum) { L.push('', 'SUMMARY', sum.text); }
  const block = (label, rows) => {
    const kept = rows.map(r => ({ r, bs: r.bullets.filter(b => isPicked(v, 'bullet', b.id)) })).filter(x => x.bs.length);
    if (!kept.length) return;
    L.push('', label);
    kept.forEach(({ r, bs }) => {
      L.push('', r.org + ' — ' + r.title + '  (' + r.start + ' – ' + r.end + ')' + (r.location ? '  ' + r.location : ''));
      bs.forEach(b => L.push('  • ' + b.text));
    });
  };
  block('EXPERIENCE', m.roles);
  block('EDUCATION', m.education);
  const as = m.achievements.filter(a => isPicked(v, 'ach', a.id));
  if (as.length) { L.push('', 'ACHIEVEMENTS'); as.forEach(a => L.push('  • ' + a.text)); }
  const sk = m.skills.filter(s => isPicked(v, 'skill', s.id));
  if (sk.length) { L.push('', 'SKILLS', '  ' + sk.map(s => s.text).join('  ·  ')); }
  return L.join('\n');
}

function resumePreview() {
  const txt = resumeText();
  const gaps = (txt.match(/\[NEEDS YOUR INPUT\]|\[CONFIRM DATES\]/g) || []).length;
  openModal(
    '<h3>' + (activeVariant() ? esc(activeVariant().name) : 'Master resume') + '<button class="x" data-action="close-modal">✕</button></h3>' +
    (gaps ? '<div class="banner warn" style="margin:0 0 12px"><strong>' + gaps + ' placeholder' + (gaps === 1 ? '' : 's') + ' in this output.</strong> Do not send it yet.</div>' : '') +
    '<pre class="respre" id="respre">' + esc(txt) + '</pre>' +
    '<div class="modal-foot">' +
      '<span class="left" style="font-size:11.5px;color:var(--muted)">' + txt.split('\n').length + ' lines · ' + txt.length + ' characters</span>' +
      '<button type="button" class="btn" data-action="close-modal">Close</button>' +
      '<button type="button" class="btn primary" data-action="res-copy">Copy to clipboard</button>' +
    '</div>', null, true);
}


/* ---------- Resume edit forms ---------- */
function themeCheckboxes(selected) {
  const sel = selected || [];
  return '<div class="chips" style="padding:2px 0">' + (state.resume.themes || []).map(t =>
    '<label class="chip' + (sel.includes(t) ? ' on' : '') + '" style="cursor:pointer">' +
      '<input type="checkbox" name="themes" value="' + t + '"' + (sel.includes(t) ? ' checked' : '') +
      ' style="width:auto;margin-right:5px;vertical-align:-1px">' + t + '</label>').join('') + '</div>';
}
const themesFrom = fd => fd.getAll('themes');

function bulletForm(id, roleId) {
  const found = id ? findBullet(id) : null;
  const b = found ? found.bullet : null;
  const role = found ? found.role : findRole(roleId);
  if (!role) { toast('Role not found'); return; }
  openModal(
    '<h3>' + (b ? 'Edit bullet' : 'New bullet') + ' · ' + esc(role.org) + '<button class="x" data-action="close-modal">✕</button></h3>' +
    '<form><div class="fgrid">' +
      '<div class="full">' + field('Bullet text', '<textarea name="text" required placeholder="Verb-first. What you did, what changed, and a number if one exists.">' + esc(b ? b.text : '') + '</textarea>') + '</div>' +
      '<div class="full">' + field('Themes — used for tailoring and highlighting', themeCheckboxes(b ? b.themes : [])) + '</div>' +
      '<div class="full"><label style="display:flex;gap:8px;align-items:center;font-size:12.5px">' +
        '<input type="checkbox" name="core" style="width:auto"' + (!b || b.core !== false ? ' checked' : '') + '> In the master by default</label></div>' +
    '</div><div class="modal-foot">' +
      (b ? '<button type="button" class="btn danger left" data-action="res-del-bullet" data-id="' + b.id + '">Delete</button>' : '') +
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
      '<button type="submit" class="btn primary">' + (b ? 'Save' : 'Add bullet') + '</button>' +
    '</div></form>',
    fd => {
      const text = String(fd.get('text') || '').trim();
      if (!text) return;
      if (b) {
        b.text = text; b.themes = themesFrom(fd); b.core = !!fd.get('core');
        if (!/\[NEEDS YOUR INPUT\]|\[CONFIRM DATES\]/.test(text)) delete b.needsInput;
      } else {
        role.bullets.push({ id: uid('b'), text, themes: themesFrom(fd), core: !!fd.get('core') });
      }
      closeModal(); toast(b ? 'Bullet saved' : 'Bullet added'); markDirty(); render();
    });
}

function summaryForm(id) {
  const m = resumeMaster();
  const s = id ? m.summaries.find(x => x.id === id) : null;
  openModal(
    '<h3>' + (s ? 'Edit summary' : 'New summary') + '<button class="x" data-action="close-modal">✕</button></h3>' +
    '<form><div class="fgrid">' +
      field('Label', inp('label', s && s.label, 'required placeholder="Associate PM"')) +
      '<div class="full">' + field('Summary text', '<textarea name="text" required style="min-height:110px">' + esc(s ? s.text : '') + '</textarea>') + '</div>' +
      '<div class="full">' + field('Themes', themeCheckboxes(s ? s.themes : [])) + '</div>' +
    '</div><div class="modal-foot">' +
      (s && m.summaries.length > 1 ? '<button type="button" class="btn danger left" data-action="res-del-summary" data-id="' + s.id + '">Delete</button>' : '') +
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
      '<button type="submit" class="btn primary">Save</button>' +
    '</div></form>',
    fd => {
      const o = s || { id: uid('sum'), core: false };
      o.label = String(fd.get('label') || '').trim();
      o.text = String(fd.get('text') || '').trim();
      o.themes = themesFrom(fd);
      if (!s) m.summaries.push(o);
      closeModal(); toast('Saved'); markDirty(); render();
    });
}

function roleForm(id) {
  const r = findRole(id);
  if (!r) return;
  openModal(
    '<h3>Edit role<button class="x" data-action="close-modal">✕</button></h3>' +
    '<form><div class="fgrid">' +
      field('Organisation', inp('org', r.org, 'required')) +
      field('Title', inp('title', r.title, 'required')) +
      field('Location', inp('location', r.location)) +
      field('Kind', sel('kind', Object.entries(RES_KINDS).map(([k, v]) => [k, v]), r.kind)) +
      field('Start', inp('start', r.start, 'placeholder="Jul 2025"')) +
      field('End', inp('end', r.end, 'placeholder="Present"')) +
    '</div><div class="modal-foot">' +
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
      '<button type="submit" class="btn primary">Save</button>' +
    '</div></form>',
    fd => {
      ['org', 'title', 'location', 'kind', 'start', 'end'].forEach(k => r[k] = String(fd.get(k) || '').trim());
      closeModal(); toast('Saved'); markDirty(); render();
    });
}

function headerForm() {
  const h = resumeMaster().header;
  openModal(
    '<h3>Resume header<button class="x" data-action="close-modal">✕</button></h3>' +
    '<form><div class="fgrid">' +
      field('Name', inp('name', h.name, 'required')) +
      field('Headline', inp('headline', h.headline, 'placeholder="Associate Product Manager"')) +
      field('Location', inp('location', h.location)) +
      field('Email', inp('email', h.email, 'type="email"')) +
      field('Phone', inp('phone', h.phone)) +
      field('LinkedIn URL', inp('linkedin', (h.links.find(l => l.label === 'LinkedIn') || {}).url, 'type="url"')) +
      field('GitHub URL', inp('github', (h.links.find(l => l.label === 'GitHub') || {}).url, 'type="url"')) +
    '</div><div class="modal-foot">' +
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
      '<button type="submit" class="btn primary">Save</button>' +
    '</div></form>',
    fd => {
      ['name', 'headline', 'location', 'email', 'phone'].forEach(k => h[k] = String(fd.get(k) || '').trim());
      h.links = [];
      const li = String(fd.get('linkedin') || '').trim(); if (li) h.links.push({ label: 'LinkedIn', url: li });
      const gh = String(fd.get('github') || '').trim(); if (gh) h.links.push({ label: 'GitHub', url: gh });
      closeModal(); toast('Saved'); markDirty(); render();
    });
}

function achForm(id) {
  const m = resumeMaster();
  const a = id ? m.achievements.find(x => x.id === id) : null;
  openModal(
    '<h3>' + (a ? 'Edit achievement' : 'New achievement') + '<button class="x" data-action="close-modal">✕</button></h3>' +
    '<form><div class="fgrid">' +
      '<div class="full">' + field('Text', '<textarea name="text" required>' + esc(a ? a.text : '') + '</textarea>') + '</div>' +
      '<div class="full">' + field('Themes', themeCheckboxes(a ? a.themes : [])) + '</div>' +
    '</div><div class="modal-foot">' +
      (a ? '<button type="button" class="btn danger left" data-action="res-del-ach" data-id="' + a.id + '">Delete</button>' : '') +
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
      '<button type="submit" class="btn primary">Save</button>' +
    '</div></form>',
    fd => {
      const o = a || { id: uid('a'), core: true };
      o.text = String(fd.get('text') || '').trim(); o.themes = themesFrom(fd);
      if (!a) m.achievements.push(o);
      closeModal(); toast('Saved'); markDirty(); render();
    });
}

function skillForm(id) {
  const m = resumeMaster();
  const s = id ? m.skills.find(x => x.id === id) : null;
  openModal(
    '<h3>' + (s ? 'Edit skill' : 'New skill') + '<button class="x" data-action="close-modal">✕</button></h3>' +
    '<form><div class="fgrid">' +
      field('Skill', inp('text', s && s.text, 'required')) +
      '<div class="full">' + field('Themes', themeCheckboxes(s ? s.themes : [])) + '</div>' +
    '</div><div class="modal-foot">' +
      (s ? '<button type="button" class="btn danger left" data-action="res-del-skill" data-id="' + s.id + '">Delete</button>' : '') +
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
      '<button type="submit" class="btn primary">Save</button>' +
    '</div></form>',
    fd => {
      const o = s || { id: uid('s') };
      o.text = String(fd.get('text') || '').trim(); o.themes = themesFrom(fd);
      if (!s) m.skills.push(o);
      closeModal(); toast('Saved'); markDirty(); render();
    });
}

function variantForm(id) {
  const v = id ? variantById(id) : null;
  const m = resumeMaster();
  const appOpts = [['', '— not linked to an application —']].concat(
    state.applications.map(a => [a.id, a.company + ' · ' + a.role]));
  openModal(
    '<h3>' + (v ? 'Variant settings' : 'Tailor a new version') + '<button class="x" data-action="close-modal">✕</button></h3>' +
    '<form><div class="fgrid">' +
      field('Name', inp('name', v && v.name, 'required placeholder="SEEK — Associate Product Manager"')) +
      field('Application', sel('appId', appOpts, v ? v.appId : '')) +
      field('Headline override', inp('headline', v && v.headline, 'placeholder="Associate Product Manager"')) +
      field('Summary', sel('summaryId', m.summaries.map(s => [s.id, s.label]), v ? v.summaryId : m.summaries[0].id)) +
      '<div class="full">' + field('Tailoring notes — what angle are you taking?',
        '<textarea name="notes" placeholder="What does this company care about, and which of your bullets prove it?">' + esc(v ? v.notes : '') + '</textarea>') + '</div>' +
      (v ? '' : '<div class="full"><label style="display:flex;gap:8px;align-items:center;font-size:12.5px">' +
        '<input type="checkbox" name="seed" checked style="width:auto"> Start from the master selection (recommended)</label></div>') +
    '</div><div class="modal-foot">' +
      (v ? '<button type="button" class="btn danger left" data-action="res-del-variant" data-id="' + v.id + '">Delete variant</button>' : '') +
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
      '<button type="submit" class="btn primary">' + (v ? 'Save' : 'Create variant') + '</button>' +
    '</div></form>',
    fd => {
      if (v) {
        ['name', 'appId', 'headline', 'summaryId', 'notes'].forEach(k => v[k] = String(fd.get(k) || '').trim());
        v.updatedAt = todayISO();
        closeModal(); toast('Variant saved');
      } else {
        const o = {
          id: uid('var'),
          name: String(fd.get('name') || '').trim(),
          appId: String(fd.get('appId') || ''),
          headline: String(fd.get('headline') || '').trim(),
          summaryId: String(fd.get('summaryId') || ''),
          notes: String(fd.get('notes') || '').trim(),
          createdAt: todayISO(), updatedAt: todayISO(),
          picks: {}, achievementPicks: {}, skillPicks: {}
        };
        if (fd.get('seed')) {
          allRoleGroups().forEach(r => r.bullets.forEach(b => { if (b.core !== false) o.picks[b.id] = true; }));
          m.achievements.forEach(a => { if (a.core !== false) o.achievementPicks[a.id] = true; });
          m.skills.forEach(s => { o.skillPicks[s.id] = true; });
        }
        state.resume.variants.push(o);
        resumeTab = o.id;
        closeModal(); toast('Variant created — now trim it down');
      }
      markDirty(); render();
    });
}

/* ---------------- Theme ---------------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const btn = $('#theme-label');
  if (btn) btn.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(cur);
  const g = $('#theme-glyph');
  if (g) g.textContent = cur === 'dark' ? '☀' : '☾';
}

/* ---------------- Init ---------------- */
(function init() {
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
  wireNav();
  render();
})();
</script>
</body>
</html>
