/* ---- Tasks (also used on the empty-state page) ---- */
let showAllTasks = false;
function tasksBlock() {
  const open = state.tasks.filter(t => !t.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  const done = state.tasks.filter(t => t.done).sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
  const list = showAllTasks ? open : open.slice(0, 5);
  const trow = t => {
    const n = t.due ? daysFromToday(t.due) : null;
    const linked = t.linkedType === 'application' ? appById(t.linkedId) : null;
    return '<label class="trow' + (t.done ? ' isdone' : '') + '"><input type="checkbox" data-action="toggle-task" data-id="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + '>' +
      '<span class="t-title">' + esc(t.title) + (linked ? ' <span class="t-linkco">' + esc(linked.company) + '</span>' : '') + '</span>' +
      (!t.done && t.due ? '<span class="t-due' + (n !== null && n <= 0 ? ' due' : '') + '">' + relDue(t.due) + '</span>' : '') +
      '<button class="rmini" data-action="edit-task" data-id="' + esc(t.id) + '">edit</button></label>';
  };
  const doneBlock = done.length
    ? '<details class="tdone"><summary>Done · ' + done.length + '<span class="tdone-hint">uncheck to restore</span></summary>' + done.slice(0, 20).map(trow).join('') + '</details>'
    : '';
  return '<div class="card panel">' + modTitle('tasks',
      (open.length > 5 ? '<button class="btn sm ghost" data-action="toggle-all-tasks">' + (showAllTasks ? 'top 5' : 'all ' + open.length) + '</button>' : '') +
      '<button class="btn sm" data-action="new-task-modal">+ Task</button>') +
    (list.map(trow).join('') || '<div class="dhint" style="margin:4px 0 2px">No open tasks. Tasks can be general — they don&#39;t have to belong to a role.</div>') +
    doneBlock + '</div>';
}
function modTasks() { return tasksBlock(); }

const MOD_RENDER = { setup: modSetup, hero: modHero, then: modThen, week: modWeek, upcoming: modUpcoming, tasks: modTasks, funnels: modFunnels };

function viewToday() {
  const ctx = { moves: computeMoves(), w: weekStats(), f: funnels() };

  /* True start state: no roles logged. One card, one action, zero guilt.
     Removing steps is the strongest documented lever (Bettinger et al. 2012:
     one removed step, +8.1pp completions). */
  if (state.applications.length === 0) {
    return '<div class="content-inner">' +
      '<div class="start-card">' +
        '<div class="sc-kicker">You are at the start, not behind</div>' +
        '<div class="sc-title">Add one role you would actually want.</div>' +
        '<div class="sc-sub">That is the whole job today. Save the company and role, then add the context you need. Pasted ad text can suggest some details for you to check.</div>' +
        '<div class="sc-actions">' +
          '<button class="btn primary" data-action="new-app">＋ Add a role</button>' +
          '<button class="btn ghost sm" data-action="go-settings">or import a backup</button>' +
        '</div>' +
      '</div>' +
      '<div class="start-mods">' + modSetup() + (state.tasks.length ? tasksBlock() : '') + '</div>' +
      '</div>';
  }

  const lastAction = [].concat(
    state.contacts.flatMap(c => (c.log || []).map(l => l.date)),
    state.applications.map(a => a.dateApplied).filter(Boolean)
  ).sort().pop();
  const away = lastAction ? -daysFromToday(lastAction) : null;
  const comeback = (away !== null && away >= 4)
    ? '<div class="comeback">' +
        '<div class="cb-h">' + away + ' days since your last recorded activity.</div>' +
        '<div class="cb-b">Review one opportunity and choose a useful next step. Outreach is optional.</div>' +
        '<button class="btn primary sm" data-action="comeback">Open the easiest one</button>' +
        '<div class="evnote" style="margin-top:10px">A missed week does not erase earlier work. Review what matters now and choose a manageable next action.</div>' +
      '</div>'
    : '';

  const mods = TODAY_ORDER.map(id => {
    const m = TODAY_MODULES[id];
    const inner = MOD_RENDER[id](ctx) || '';
    if (!inner) return '';
    return '<div class="tmod' + (m.span === 2 ? ' span2' : '') + '" data-mod="' + id + '">' + inner + '</div>';
  }).join('');

  return '<div class="content-inner">' + comeback + '<div class="today-mods">' + mods + '</div></div>';
}

/* ================================================================
   Roles — one sheet, one drawer. Every row is a role you're chasing.
   ================================================================ */
let roleFilters = { q: '', market: '', stage: 'active', priority: '', cold: false };
let selectedApps = new Set();

/* Four steps, in order. You cannot look ready without a human attached. */
/* Four things you DO, in order. Nothing here is a state of mind.
   Harkin et al. 2016 (Psych Bulletin, k=138 RCTs, N=19,951): monitoring a
   BEHAVIOUR moves that behaviour (d+ = 0.79); monitoring outcomes does not
   move behaviour (d+ = 0.14, null). So every dot is an action, never an insight. */
const READY_STEPS = [
 { k:'logged',lab:'Saved',hint:'Opportunity recorded.' },
 { k:'human',lab:'Contact',hint:'Optional contact lead; this does not confirm a referral.' },
 { k:'sent',lab:'Outreach',hint:'An actual sent message has been recorded.' },
 { k:'applied',lab:'Applied',hint:'An actual submission date has been recorded.' }
];
const DIRECT_STEPS = [READY_STEPS[0],READY_STEPS[3]];

function stepsFor(a) { return a.approach === 'direct' ? DIRECT_STEPS : READY_STEPS; }
function readiness(a) {
  const people = roleContacts(a.id);
  return {
    logged: true,
    human: people.length > 0,
    sent: people.some(c => (c.log || []).some(l => l.kind === 'sent')),
    applied: !!a.dateApplied,
    talked: people.some(c => ['replied', 'call_booked', 'met'].includes(c.status)),
    people,
  };
}
/* Touch count across every person on this role. Pin (4M messages): three touches
   capture 93.2% of all replies; the 4th yields 4.5%. We hard-stop at 3. */
function touchCount(a) { return roleContacts(a.id).reduce((n, c) => n + (c.log || []).length, 0); }
const MAX_TOUCHES = 3;
function readyCount(a) { const r = readiness(a), st = stepsFor(a); return st.filter(s => r[s.k]).length / st.length; }

function filteredApps() {
  const f = roleFilters;
  let list = state.applications.filter(a=>f.stage==='archived'?!!a.archivedAt:!a.archivedAt);
  if (f.stage === 'active') list = list.filter(isActive);
  else if (f.stage === 'closed') list = list.filter(a => !isActive(a));
  else if (f.stage && f.stage!=='archived') list = list.filter(a => a.stage === f.stage);
  if (f.market === '__focus') list = list.filter(a => ['Sydney / Melbourne','Brisbane / Remote AU','Australia / city unconfirmed'].includes(a.market));
  else if (f.market) list = list.filter(a => a.market === f.market);
  if (f.priority) list = list.filter(a => a.priority === f.priority);
  if (f.cold) list = list.filter(a => a.approach !== 'direct' && !roleContacts(a.id).length);
  if (f.q) {
    const q = f.q.toLowerCase();
    list = list.filter(a => (a.company + ' ' + a.role + ' ' + (a.location||'') + ' ' + (a.hook||'') + ' ' + (a.notes||'')).toLowerCase().includes(q));
  }
  const k = tableSort.key, dir = tableSort.dir;
  if (k === 'workflow') list.sort((a,b)=>Number(!isActive(a))-Number(!isActive(b)) || Number(!/Sydney|Melbourne|Brisbane|AU|Australia/i.test(a.location||''))-Number(!/Sydney|Melbourne|Brisbane|AU|Australia/i.test(b.location||'')) || STAGES.findIndex(x=>x.id===b.stage)-STAGES.findIndex(x=>x.id===a.stage) || Number(!roleContacts(a.id).length)-Number(!roleContacts(b.id).length) || a.company.localeCompare(b.company));
  else if (k === 'ready') list.sort((a, b) => (readyCount(a) - readyCount(b)) * dir);
  else list.sort((a, b) => String(a[k] || '').localeCompare(String(b[k] || '')) * dir);
  return list;
}

/* The one column a spreadsheet can't give you. Every branch names an ACTION. */
function nextMove(a) {
 if(!isActive(a))return {text:'Closed record',cls:'muted'};
 if(a.nextAction)return {text:a.nextAction,cls:a.nextActionDate && daysFromToday(a.nextActionDate)<0?'due':'',when:a.nextActionDate?relDue(a.nextActionDate):''};
 if(a.availability==='unavailable')return {text:'Listing unavailable; review next step',cls:'muted'};
 if(a.opportunityKind==='target')return {text:'Explore openings and team context',cls:''};
 if(!a.dateApplied)return {text:'Review requirements and evidence',cls:''};
 return {text:'Set a next action when needed',cls:'muted'};
}

/* Posting age is context, not a reason to delay a ready application. */
function weeksSincePosted(a) {
  if (!a.datePosted) return null;
  const d = -daysFromToday(a.datePosted);
  return d / 7;
}

function readyDots(a) {
  const r = readiness(a), st = stepsFor(a);
  return '<span class="dots" title="' + st.map(s => (r[s.k] ? '✓ ' : '· ') + s.lab).join('\n') + (a.approach === 'direct' ? '\n(direct route)' : '') + '">' +
    st.map(s => '<i class="' + (r[s.k] ? 'on' : '') + '"></i>').join('') + '</span>';
}

function viewRoles() {
  const f = roleFilters;
  const list = filteredApps();
  const total = state.applications.length;
  const noHuman = state.applications.filter(a => isActive(a) && a.approach !== 'direct' && !roleContacts(a.id).length).length;
  const chip = (label, on, action, val) =>
    '<button class="chip' + (on ? ' on' : '') + '" data-action="' + action + '" data-val="' + val + '">' + label + '</button>';

    '<input type="search" id="app-q" placeholder="Search company, role, your angle…" value="' + esc(f.q) + '">' +
    '<div class="spacer"></div>' +
    '<span class="sheet-count">' + list.length + ' of ' + total + '</span>' +
    '</div>' +
    '<div class="chips sheet-chips">' +
      chip('Active', f.stage === 'active', 'fstage', 'active') +
      chip('All', f.stage === '', 'fstage', '') +
      chip('Closed', f.stage === 'closed', 'fstage', 'closed') +
      chip('Archived', f.stage === 'archived', 'fstage', 'archived') +
      '<span class="chip-div"></span>' +
      chip('★ Australia', f.market === '__focus', 'fmarket', '__focus') +
      chip('Everywhere', f.market === '', 'fmarket', '') +
      '<span class="chip-div"></span>' +
      chip('High priority', f.priority === 'high', 'fprio', 'high') +
      chip('No contact yet' + (noHuman ? ' · ' + noHuman : ''), f.cold, 'fcold', '1') +
    '</div>';

  const bulk = selectedApps.size
    ? '<div class="bulkbar"><strong>' + selectedApps.size + ' selected</strong>' +
        '<select id="bulk-stage"><option value="">Move to stage…</option>' +
          ALL_STAGES.map(s => '<option value="' + esc(s.id) + '">' + s.label + '</option>').join('') + '</select>' +
        '<select id="bulk-market"><option value="">Set market…</option>' +
          MARKETS.map(m => '<option>' + m + '</option>').join('') + '</select>' +
        '<button class="btn sm" data-action="bulk-clear">Clear</button>' +
        '<button class="btn sm danger" data-action="bulk-del">Archive</button>' +
      '</div>' : '';

  return '<div class="sheet-page"><p style="padding:10px 20px 0;color:var(--ink-2);font-size:12px">Authenticity over volume. Keep your opportunities, people and next steps together. Outreach is optional.</p>' + bar + sheetHTML(list) + bulk + '</div>';
}

const SHEET_COLS = [
  { k:'company', lab:'Company', w:150, type:'text' },
  { k:'role', lab:'Role', w:208, type:'text' },
  { k:'stage', lab:'Stage', w:134, type:'stage' },
  { k:'people', lab:'People', w:68, type:'derived' },
  { k:'nextMove', lab:'Next action', w:290, type:'derived' },
  { k:'priority', lab:'Priority', w:96, type:'enum', opts:['high','med','low'] },
  { k:'market', lab:'Market', w:156, type:'enum', optsFn:()=>MARKETS },
];

function sheetHTML(list) {
  const head = '<tr><th class="c-sel"><input type="checkbox" data-action="sel-all"' +
      (list.length && list.every(a => selectedApps.has(a.id)) ? ' checked' : '') + '></th>' +
    SHEET_COLS.map((c, i) => '<th style="min-width:' + c.w + 'px;width:' + c.w + 'px"' +
      ' class="' + (i === 0 ? 'c-first ' : '') + (c.k === 'people' || c.k === 'nextMove' ? '' : 'sortable') + '"' +
      (c.k === 'people' || c.k === 'nextMove' ? '' : ' data-action="sort" data-key="' + c.k + '"') + '>' +
      '<span class="th-in">' + c.lab +
        (tableSort.key === c.k ? '<span class="arr">' + (tableSort.dir === 1 ? '↑' : '↓') + '</span>' : '') +
      '</span></th>').join('') + '<th class="c-open"></th></tr>';

  const rows = list.map(a => {
    const nm = nextMove(a);
    const people = roleContacts(a.id).length;
    const cells = SHEET_COLS.map((c, ci) => {
      const first = ci === 0 ? ' c-first' : '';
      if (c.k === 'ready') return '<td class="c-ready" data-action="open-role" data-id="' + esc(a.id) + '">' + readyDots(a) + '</td>';
      if (c.k === 'people') return '<td class="c-people' + (people ? '' : ' none') + '" data-action="open-role" data-id="' + esc(a.id) + '">' + (people || '—') + '</td>';
      if (c.k === 'nextMove') return '<td class="c-next ' + nm.cls + '" data-action="open-role" data-id="' + esc(a.id) + '">' + esc(nm.text) +
        (nm.when ? ' <span class="nm-when">' + nm.when + '</span>' : '') + '</td>';
      if (c.type === 'stage') {
        return '<td class="c-in"><select class="cell-in stage-in" data-cell="stage" data-id="' + esc(a.id) + '">' +
          ALL_STAGES.map(x => '<option value="' + esc(x.id) + '"' + (x.id === a.stage ? ' selected' : '') + '>' + x.label + '</option>').join('') +
          '</select></td>';
      }
      if (c.type === 'enum') {
        const opts = c.opts || c.optsFn();
        const labels = { high: 'High', med: 'Medium', low: 'Low' };
        return '<td class="c-in"><select class="cell-in" data-cell="' + c.k + '" data-id="' + esc(a.id) + '">' +
          (c.k === 'market' ? '<option value=""></option>' : '') +
          opts.map(o => '<option value="' + esc(o) + '"' + (o === a[c.k] ? ' selected' : '') + '>' + esc(labels[o] || o) + '</option>').join('') +
          '</select></td>';
      }
      return '<td class="c-in' + first + '"><input class="cell-in' + (!a[c.k] ? ' is-blank' : '') + '" type="text" data-cell="' + c.k +
        '" data-id="' + esc(a.id) + '" value="' + esc(a[c.k] || '') + '" placeholder="—">'+(c.k==='company'?'<button class="mobile-role-open" data-action="open-role" data-id="'+esc(a.id)+'">'+esc(a.company)+' →</button>':'')+'</td>';
    }).join('');
    return '<tr class="' + (isActive(a) ? '' : 'closed ') + (selectedApps.has(a.id) ? 'sel ' : '') + (openRoleId === a.id ? 'open' : '') + '">' +
      '<td class="c-sel"><input type="checkbox" data-action="sel-row" data-id="' + esc(a.id) + '"' + (selectedApps.has(a.id) ? ' checked' : '') + '></td>' +
      cells +
      '<td class="c-open"><button class="chev-open" data-action="open-role" data-id="' + esc(a.id) + '" title="Open">›</button></td></tr>';
  }).join('');

  const ready = list.filter(a => readyCount(a) === 4).length;
  return '<div class="sheet-wrap"><table class="sheet"><thead>' + head + '</thead><tbody>' +
    (rows || '<tr class="norows"><td colspan="' + (SHEET_COLS.length + 2) + '"><div class="empty">' +
      (state.applications.length ? 'Nothing matches these filters.' : 'No roles yet. ＋ New → Role. One is enough to start.') +
      '</div></td></tr>') +
    '</tbody></table></div>' +
    '<div class="sheet-foot">' +
      '<span>' + list.length + ' row' + (list.length === 1 ? '' : 's') + (ready ? ' · ' + ready + ' fully ready' : '') + '</span>' +
      '<span class="sf-hint">Type in any cell · Enter moves down · click a row to open it</span>' +
    '</div>';
}

function commitCell(id, field, value) {
  const a = state.applications.find(x => x.id === id);
  if (!a) return;
  const v = String(value).trim();
  if ((a[field] || '') === v) return;
  a[field] = v;
  if (field === 'stage') {
    // Application dates are recorded explicitly; stage changes do not infer them.
    (a.log = a.log || []).push({ date: todayISO(), text: 'Stage → ' + stageById(v).label });
  }
  markDirty();
}

/* ================================================================
   The drawer — the whole flow for one role, in order
   ================================================================ */
function renderDrawer() {
  const host = document.getElementById('drawer-host');
  const a = openRoleId ? state.applications.find(x => x.id === openRoleId) : null;
  if (!a) { host.className = 'drawer-host'; host.innerHTML = ''; return; }
  host.className = 'drawer-host open';
  host.innerHTML = drawerHTML(a);
}

/* ONE prompt, shown at write-time, asking for a FACT about them — not an
   aspiration about you. Two reasons for this shape:
   · Verbeke et al. 2011 (k=268, N=79,747 salespeople): selling-related KNOWLEDGE
     is the top predictor of performance (β=.28); role ambiguity is the worst
     drag (β=−.25). Knowing the thing helps. Wanting the thing does not.
   · Scheibehenne et al. 2010: adding a justification requirement dropped action
     from 88% to 72%. "Why you specifically" IS a justification requirement. */
const PROMPTS = { hook: 'Record a specific reason for contacting this person, with its source. A shared connection or a clear question can be enough.' };

function drawerHTML(a) {
  const r = readiness(a);
  const people = r.people;
  const variants = (state.resume.variants || []).filter(v => v.appId === a.id);

  const direct = a.approach === 'direct';

/* A draft outline to check and edit using your own evidence. */
function seedDraft(a) {
  const person = roleContacts(a.id)[0];
  const who = person ? person.name.split(' ')[0] : '[Name]';
  const hook = (a.hook || '').trim();
  const st = state.stories.find(s => (s.themes || []).includes('product')) || state.stories[0];
  const role = (a.role || '').trim();
  const lines = [
    'Hi ' + who + ' —',
    '',
    hook || '[One fact about ' + a.company + ' you could only know by looking.]',
    '',
    '[Add one accurate sentence about your background and why this role interests you.]',
    '',
    'Not asking for a referral. I\'d just like fifteen minutes on what the ' +
      (role ? role + ' job' : 'job') + ' is actually like day to day.',
  ];
  a.draft = lines.join('\n');
  markDirty(); render();
  toast('Draft outline ready — verify every fact and replace placeholders before copying');
}

/* Records an action the user says they have already taken. */
function markSent(a) {
  const people = roleContacts(a.id);
  if (!people.length) { toast('Add a person first'); return; }
  const c = people.find(x => (x.log || []).length < MAX_TOUCHES) || people[0];
  if ((c.log || []).length >= MAX_TOUCHES) { toast('Three touches already sent to ' + c.name); return; }
  (c.log = c.log || []).push({ date: todayISO(), channel: 'LinkedIn DM', text: (c.log||[]).length ? 'Follow-up ' + ((c.log||[]).length) : 'First message sent' });
  c.lastTouch = todayISO();
  if (c.status === 'identified') c.status = 'reached_out';
  markDirty(); render();
  toast('Logged — touch ' + c.log.length + ' of 3 to ' + c.name.split(' ')[0]);
}

/* ---------------- Contacts ---------------- */
function storyText(s) {
  if (s.situation) return ['Situation: ' + s.situation, 'Task: ' + s.task, 'Action: ' + s.action, 'Result: ' + s.result].join('\n');
  return s.body || '';
}
/* The one-liner other parts of the app fetch: the Result, minus trailing commentary. */
function storyLine(s) {
  const r = (s.result || s.body || '').split(/\.\s/)[0];
  return r.replace(/\.$/, '');
}

function viewStories() {
  const allThemes = [...new Set(state.stories.flatMap(s => s.themes || []))].sort();
  let list = state.stories;
  if (storyFilter) list = list.filter(s => (s.themes || []).includes(storyFilter));
  const STAR_ROWS = [['situation','S','Situation'],['task','T','Task'],['action','A','Action'],['result','R','Result']];
  return '<div class="content-inner">' +
    '<div class="toolbar"><span style="font-size:12.5px;color:var(--ink-2);font-weight:600">Theme:</span>' +

          : '<div class="s-body">' + esc(s.body || '') + '</div><div class="tag warn" style="margin-top:6px">Not in STAR yet — edit to split it</div>') +

/* ---------------- Modal system ---------------- */
function openModal(html, onSubmit, wide) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.id = 'modal-back';
  back.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div>';
  document.body.appendChild(back);
  back.addEventListener('mousedown', e => { if (e.target === back) closeModal(); });
  const form = back.querySelector('form');
  if (form && onSubmit) form.addEventListener('submit', e => { e.preventDefault(); onSubmit(new FormData(form), form); });
  const first = back.querySelector('input,textarea,select');
  if (first) first.focus();
}
function closeModal() { const m = $('#modal-back'); if (m) m.remove(); }
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); if (done) done(); }
  catch (e) { toast('Copy failed — select the text and copy manually'); }
  document.body.removeChild(ta);
}
const field = (label, inner) => '<div class="field"><label>' + label + '</label>' + inner + '</div>';
const inp = (name, val, attrs) => '<input name="' + name + '" value="' + esc(val || '') + '" ' + (attrs || '') + '>';
const sel = (name, opts, val) => '<select name="' + name + '">' + opts.map(o => {
  const [v, l] = Array.isArray(o) ? o : [o, o];
  return '<option value="' + esc(v) + '"' + (v === val ? ' selected' : '') + '>' + esc(l) + '</option>';
}).join('') + '</select>';

/* Paste-a-job-ad parser. Heuristics, reviewed by the user before saving —
   recognition over recall: reading a prefilled form and correcting it is far
   cheaper than recalling and typing every field. All best-effort regex; the
   form stays fully editable. */
function parseJobAd(text) {
  const out = {};
  const t = String(text || '').trim();
  if (!t) return out;
  const urlM = t.match(/https?:\/\/[^\s"'<>]+/);
  if (urlM) {
    out.jdUrl = urlM[0].replace(/[).,]+$/, '');
    const host = (out.jdUrl.match(/\/\/(?:www\.)?([^\/]+)/) || [])[1] || '';
    if (/seek\.com/.test(host)) out.source = 'SEEK';
    else if (/linkedin\.com/.test(host)) out.source = 'LinkedIn';
    else if (/indeed\./.test(host)) out.source = 'Indeed';
    else if (/greenhouse\.io|lever\.co|workable\.com|ashbyhq\.com|smartrecruiters\.com|jobs\./.test(host)) out.source = 'Company site';
    const slug = out.jdUrl.match(/(?:boards\.greenhouse\.io|jobs\.lever\.co|jobs\.ashbyhq\.com)\/([A-Za-z0-9-_]+)/);
    if (slug) out.company = slug[1].replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }
  const lines = t.split(/\n+/).map(x => x.trim()).filter(x => x && !/^https?:\/\//.test(x));
  const TITLE_RE = /(manager|engineer|analyst|associate|director|designer|coordinator|lead|specialist|consultant|officer|developer|scientist|producer|marketer|intern|graduate|representative|executive|head of)/i;
  const ti = lines.findIndex(l => l.length < 90 && TITLE_RE.test(l));
  if (ti > -1) {
    let title = lines[ti];
    const atM = title.match(/^(.*?)\s+(?:at|@)\s+([A-Z][\w&.'\- ]{1,40})$/);
    if (atM) { title = atM[1]; out.company = out.company || atM[2].trim(); }
    out.role = title.replace(/\s*[-–—|•·]\s*$/, '').trim();
    // job-board layout: the line after the title is often "Company · Location"
    const after = lines[ti + 1] || '';
    if (!out.company && /[·•|]/.test(after)) out.company = after.split(/[·•|]/)[0].trim();
    else if (!out.company && after.length < 45 && /^[A-Z]/.test(after) && !TITLE_RE.test(after) && !/\d/.test(after)) out.company = after.trim();
  }
  let m = t.match(/^Company:\s*(.+)$/mi);
  if (m) out.company = m[1].trim();
  const locM = t.match(/(Sydney|Melbourne|Brisbane|Perth|Adelaide|Canberra|Gold Coast|Hobart|Darwin|Auckland|Wellington|New York|San Francisco|Los Angeles|Austin|Seattle|Boston|Chicago|Denver|Miami|London|Berlin|Dublin|Amsterdam|Paris|Singapore|Remote)(?:[ ,]{1,2}(?:[A-Z]{2,3}|[A-Z][a-z]+)){0,2}/);
  if (locM) out.location = locM[0].replace(/[ ,]+$/, '').trim();
  const salM = t.match(/\$\s?\d{2,3}(?:,\d{3})?(?:\s?[kK])?(?:\s?[-–—]\s?\$?\s?\d{2,3}(?:,\d{3})?(?:\s?[kK])?)?(?:\s*(?:per annum|p\.?a\.?|\+\s*super(?:annuation)?))?/);
  if (salM) out.salary = salM[0].replace(/\s+/g, ' ').trim();
  m = t.match(/[Pp]osted\s+(\d+)\+?\s*(day|week|hour)s?\s+ago/);
  if (m) {
    const nn = +m[1];
    out.datePosted = isoPlus(m[2] === 'week' ? -nn * 7 : m[2] === 'day' ? -nn : 0);
  } else if (/[Pp]osted\s+today|[Jj]ust posted/.test(t)) out.datePosted = todayISO();
  if (out.location) {
    const l = out.location.toLowerCase();
    if (/sydney|melbourne/.test(l)) out.market = 'Sydney / Melbourne';
    else if (/brisbane/.test(l)) out.market = 'Brisbane / Remote AU';
    else if (/new york|san francisco|los angeles|austin|seattle|boston|chicago|denver|miami/.test(l)) out.market = 'United States';
    else if (/london|berlin|dublin|amsterdam|paris/.test(l)) out.market = 'UK / Europe';
  }
  if (out.role) {
    const rl = out.role.toLowerCase();
    if (/product/.test(rl)) out.roleType = 'Product / APM';
    else if (/growth|marketing|gtm/.test(rl)) out.roleType = 'Growth / GTM';
    else if (/sales|sdr|business development/.test(rl)) out.roleType = 'SDR / BD';
    else if (/solutions|implementation/.test(rl)) out.roleType = 'Solutions / Implementation';
    else if (/analyst/.test(rl)) out.roleType = 'Business / Commercial analyst';
    else if (/operations|chief of staff|bizops/.test(rl)) out.roleType = 'BizOps / Chief of Staff';
  }
  Object.keys(out).forEach(k => { if (!out[k]) delete out[k]; });
  return out;
}

/* ---------------- Event delegation ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  if (el.tagName === 'A' && act) e.preventDefault();
  switch (act) {
    case 'nav': currentView = el.dataset.view; navPinned = false; navClose(true); addMenuClose(); markMenuClose(); render(); break;
    case 'go-settings': currentView = 'settings'; render(); break;
    case 'new-app': addMenuClose(); markMenuClose(); appForm(); break;
    case 'log-touch': logTouchForm(id); break;
    case 'new-task-modal': addMenuClose(); markMenuClose(); taskForm(); break;
    case 'edit-task': taskForm(id); break;
    case 'new-story': storyForm(); break;
    case 'edit-story': storyForm(id); break;
    case 'close-modal': closeModal(); break;
    case 'fstage': roleFilters.stage = el.dataset.val; selectedApps.clear(); render(); break;
    case 'fmarket': roleFilters.market = el.dataset.val; selectedApps.clear(); render(); break;
    case 'fprio': roleFilters.priority = roleFilters.priority === el.dataset.val ? '' : el.dataset.val; render(); break;
    case 'fcold': roleFilters.cold = !roleFilters.cold; render(); break;
    case 'open-role': openRoleId = id; render(); break;
    case 'close-drawer': openRoleId = null; render(); break;
    case 'add-person': personForm(null, id); break;
    case 'edit-person': personForm(id); break;
    case 'del-person':
      if (confirm('Delete this person?')) {
        state.contacts = state.contacts.filter(c => c.id !== id);
        closeModal(); toast('Deleted'); markDirty(); render();
      }
      break;
    case 'log-touch': logTouchForm(id); break;
    case 'seed-draft': seedDraft(state.applications.find(a => a.id === id)); break;
    case 'insert-story': {
      const st = state.stories.find(x => x.id === id);
      const a = state.applications.find(x => x.id === openRoleId);
      if (st && a) {
        const line = 'For context: ' + storyLine(st).charAt(0).toLowerCase() + storyLine(st).slice(1) + '.';
        a.draft = (a.draft || '').trim() ? a.draft.trim() + '\n\n' + line : line;
        st.usedIn = [...new Set([...(st.usedIn || []), a.company])];
        markDirty(); render(); toast('Proof line added — keep it to one');
      }
      break;
    }
    case 'mark-sent': markSent(state.applications.find(a => a.id === id)); break;
    case 'tailor-for': {
      currentView = 'resume'; openRoleId = null; render();
      variantForm(); 
      const s = document.querySelector('select[name="appId"]');
      if (s) s.value = id;
      const n = document.querySelector('input[name="name"]');
      const app = state.applications.find(a => a.id === id);
      if (n && app) n.value = app.company + ' — ' + app.role;
      break;
    }
    case 'edit-role-meta': appForm(id); break;
    case 'sel-all': {
      const list = filteredApps();
      if (list.every(a => selectedApps.has(a.id))) selectedApps.clear();
      else list.forEach(a => selectedApps.add(a.id));
      render(); break;
    }
    case 'sel-row':
      if (selectedApps.has(id)) selectedApps.delete(id); else selectedApps.add(id);
      render(); break;
    case 'bulk-clear': selectedApps.clear(); render(); break;
    case 'bulk-del':
      if(confirm('Archive '+selectedApps.size+' selected opportunities? Their documents, people and history will be retained.')){
        state.applications.forEach(a=>{if(selectedApps.has(a.id))a.archivedAt=new Date().toISOString();});
        selectedApps.clear();toast('Archived');markDirty();
      }break;
    case 'edit-weekly': weeklyForm(); break;
    case 'comeback': {
      // easiest = furthest along, so the next action is smallest
      const cand = state.applications.filter(isActive)
        .map(a => ({ a, r: readiness(a), t: touchCount(a) }))
        .filter(x => x.t < MAX_TOUCHES)
        .sort((x, y) => (y.r.human - x.r.human) || (x.t - y.t))[0];
      if (cand) { currentView = 'roles'; openRoleId = cand.a.id; render(); }
      else { currentView = 'roles'; render(); appForm(); }
      break;
    }
    case 'toggle-all-tasks': showAllTasks = !showAllTasks; render(); break;
    case 'sort': {
      const k = el.dataset.key;
      if (tableSort.key === k) tableSort.dir *= -1; else { tableSort.key = k; tableSort.dir = 1; }
      render(); break;
    }

    case 'res-edit-summary': summaryForm(id); break;

    }
    case 'res-del-summary':
      if (confirm('Delete this summary?')) {
        resumeMaster().summaries = resumeMaster().summaries.filter(s => s.id !== id);

        closeModal(); toast('Deleted'); markDirty(); render();
      }
      break;
    case 'res-add-ach': achForm(); break;
    case 'res-edit-ach': achForm(id); break;
    case 'res-del-ach':
      if (confirm('Delete this achievement?')) {
        resumeMaster().achievements = resumeMaster().achievements.filter(a => a.id !== id);
        (state.resume.variants || []).forEach(v => { if (v.achievementPicks) delete v.achievementPicks[id]; });
        closeModal(); toast('Deleted'); markDirty(); render();
      }
      break;
    case 'res-add-skill': skillForm(); break;
    case 'res-del-skill':
      resumeMaster().skills = resumeMaster().skills.filter(s => s.id !== id);
      (state.resume.variants || []).forEach(v => { if (v.skillPicks) delete v.skillPicks[id]; });
      closeModal(); toast('Deleted'); markDirty(); render();
      break;
    case 'res-new-variant': variantForm(); break;
    case 'res-edit-variant': variantForm(id); break;
    case 'res-del-variant':
      if (confirm('Delete this tailored variant? The master is untouched.')) {
        state.resume.variants = state.resume.variants.filter(v => v.id !== id);
        if (resumeTab === id) resumeTab = 'master';

      const g = resumeGaps()[0];

    case 'copy-sync': markMenuClose(); doCopySync(); break;
    case 'download-backup': doDownload(); break;
    case 'recovery-export': downloadRecovery(); break;
    case 'restore-backup': restoreBackup(); break;
    case 'import-paste': { const v = $('#import-area').value.trim(); if (v) doImport(v); else toast('Paste JSON first'); break; }
    case 'toggle-theme': markMenuClose(); toggleTheme(); break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'app-q') { roleFilters.q = e.target.value; refreshSheet(); }
  if(e.target.classList.contains('drawer-in') && (e.target.tagName==='TEXTAREA' || e.target.type==='text')) commitDrawer(e.target);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'bulk-stage' && t.value) {
    selectedApps.forEach(id => commitCell(id, 'stage', t.value));
    toast(selectedApps.size + ' moved to ' + stageById(t.value).label);
    selectedApps.clear(); render(); return;
  }
  if (t.id === 'bulk-market' && t.value) {
    selectedApps.forEach(id => commitCell(id, 'market', t.value));
    toast(selectedApps.size + ' market set'); selectedApps.clear(); render(); return;
  }
  // inline sheet cells: selects commit immediately
  if (t.classList.contains('cell-in') && t.tagName === 'SELECT') {
    commitCell(t.dataset.id, t.dataset.cell, t.value);
    refreshSheet(); return;
  }
  if (t.classList.contains('drawer-in') && (t.tagName === 'SELECT' || t.type === 'date')) { commitDrawer(t); return; }
  if (t.id === 'import-file') {
    const f = t.files[0];
    if (f) { const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(f); }
  }
});
// spreadsheet behaviour: focusing a text cell selects it, so typing overwrites
const isTextCell = t => t && t.classList && t.classList.contains('cell-in') && t.tagName === 'INPUT' && t.type === 'text';
document.addEventListener('focusin', e => { if (isTextCell(e.target)) { try { e.target.select(); } catch (err) {} } });
// stop the click's caret placement from collapsing that selection
document.addEventListener('mouseup', e => { if (isTextCell(e.target) && e.target.selectionStart === e.target.selectionEnd && document.activeElement === e.target) return; if (isTextCell(e.target)) e.preventDefault(); }, true);
// text/date cells commit on blur
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('cell-in') && t.tagName === 'INPUT') {
    commitCell(t.dataset.id, t.dataset.cell, t.value);
  }
  // drawer fields autosave — no save button anywhere in this app
  if (t.classList && t.classList.contains('drawer-in')) commitDrawer(t);
});
function commitDrawer(t) {
  const a = state.applications.find(x => x.id === t.dataset.id);
  if (!a) return;
  const k = t.dataset.dcell, v = t.value;
  if ((a[k] || '') === v) return;
  a[k] = v;
  if (k === 'dateApplied' && v && a.stage === 'research') a.stage = 'applied';
  markDirty(false);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); if (e.target.classList && e.target.classList.contains('cell-in')) e.target.blur(); }
  const t = e.target;
  if (t.tagName !== 'SELECT' && t.classList && t.classList.contains('cell-in') && (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    if (e.key === 'Enter' && t.tagName === 'INPUT') commitCell(t.dataset.id, t.dataset.cell, t.value);
    e.preventDefault();
    const col = t.dataset.cell;
    const all = Array.from(document.querySelectorAll('.cell-in[data-cell="' + col + '"]'));
    const i = all.indexOf(t);
    const next = all[i + (e.key === 'ArrowUp' ? -1 : 1)];
    if (next) { next.focus(); if (next.select) try { next.select(); } catch (err) {} }
    else t.blur();
  }
});

/* Re-render the sheet without losing the cell you're typing in. */
function refreshSheet() {
  const el = document.activeElement;
  const key = el && el.classList && el.classList.contains('cell-in')
    ? { id: el.dataset.id, cell: el.dataset.cell } : null;
  const q = el && el.id === 'app-q' ? el.selectionStart : null;
  render();
  if (key) {
    const back = document.querySelector('.cell-in[data-id="' + esc(key.id) + '"][data-cell="' + key.cell + '"]');
    if (back) back.focus();
  } else if (q !== null) {
    const s = document.getElementById('app-q');
    if (s) { s.focus(); try { s.setSelectionRange(q, q); } catch (err) {} }
  }
}

/* Debounced-ish body refresh that preserves search focus */
function refreshBody() {
  const focused = document.activeElement && document.activeElement.id;
  const pos = focused ? document.activeElement.selectionStart : null;
  render();
  if (focused) {
    const el = document.getElementById(focused);
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
  }
}



/* ================================================================
   Resume — master bullet library + per-application tailored variants
   ================================================================ */
const RES_KINDS = { work: 'Experience', leadership: 'Leadership', education: 'Education', project: 'Projects' };
let resumeTab = 'master';          // 'master' | variant id
let resumeThemeFilter = '';

function resumeMaster() { return state.resume.master; }
function allRoleGroups() { return resumeMaster().roles.concat(resumeMaster().education); }
function findRole(id) { return allRoleGroups().find(r => r.id === id); }
function findBullet(id) {
  for (const r of allRoleGroups()) { const b = r.bullets.find(x => x.id === id); if (b) return { role: r, bullet: b }; }
  return null;
}
function resumeGaps() {
  const out = [];
  allRoleGroups().forEach(r => r.bullets.forEach(b => { if (b.needsInput) out.push({ role: r, bullet: b }); }));
  return out;
}
function variantById(id) { return (state.resume.variants || []).find(v => v.id === id); }
function activeVariant() { return resumeTab === 'master' ? null : variantById(resumeTab); }

/* which bullets/achievements/skills are included for the current tab */
function isPicked(v, kind, id) {
  if (!v) {   // master view: core flag decides
    if (kind === 'bullet') { const f = findBullet(id); return f ? f.bullet.core !== false : false; }
    if (kind === 'ach') { const a = resumeMaster().achievements.find(x => x.id === id); return a ? a.core !== false : false; }
    return true;
  }
  const map = kind === 'bullet' ? v.picks : kind === 'ach' ? v.achievementPicks : v.skillPicks;
  return !!(map && map[id]);
}
function togglePick(kind, id) {
  const v = activeVariant();
  if (!v) {   // editing the master's default set
    if (kind === 'bullet') { const f = findBullet(id); if (f) f.bullet.core = !(f.bullet.core !== false); }
    else if (kind === 'ach') { const a = resumeMaster().achievements.find(x => x.id === id); if (a) a.core = !(a.core !== false); }
    else { skillForm(id); return; }   // master view: click a skill to edit or delete it
  } else {
    const key = kind === 'bullet' ? 'picks' : kind === 'ach' ? 'achievementPicks' : 'skillPicks';
    v[key] = v[key] || {};
    if (v[key][id]) delete v[key][id]; else v[key][id] = true;
    v.updatedAt = todayISO();
  }
  markDirty(); refreshBody();
}

function countIncluded(v) {
  let n = 0;
  allRoleGroups().forEach(r => r.bullets.forEach(b => { if (isPicked(v, 'bullet', b.id)) n++; }));
  resumeMaster().achievements.forEach(a => { if (isPicked(v, 'ach', a.id)) n++; });
  return n;
}

/* ---------- rendered plain-text resume ---------- */
function resumeTextFor(m,v) {
 const lines=[m.header.name.toUpperCase(),v && v.headline || m.header.headline,[m.header.location,m.header.email,m.header.phone].filter(Boolean).join(' | '),m.header.links.map(l=>l.label+': '+l.url).join(' | ')];
 const picked=(kind,item)=>v ? !!((v[kind]||{})[item.id]) : item.core!==false;
 const sum=v ? m.summaries.find(x=>x.id===v.summaryId) : m.summaries.find(x=>x.core!==false);
 if(sum)lines.push('','SUMMARY',sum.text);
 [['EXPERIENCE',m.roles],['EDUCATION',m.education]].forEach(([label,roles])=>{
  const kept=roles.map(r=>({r,bs:r.bullets.filter(x=>picked('picks',x))})).filter(x=>x.bs.length);
  if(kept.length)lines.push('',label);
  kept.forEach(({r,bs})=>{lines.push('',r.org+' | '+r.title+' ('+r.start+' to '+r.end+')');bs.forEach(b=>lines.push(' • '+(v && v.overrides && v.overrides[b.id] || b.text)));});
 });
 const ach=m.achievements.filter(x=>picked('achievementPicks',x));if(ach.length)lines.push('','ACHIEVEMENTS',...ach.map(x=>' • '+x.text));
 const skills=m.skills.filter(x=>v?picked('skillPicks',x):true);if(skills.length)lines.push('','SKILLS',skills.map(x=>x.text).join(' · '));
 return lines.join('\n');
}

let evidenceBaseline=null;
function resetEvidenceBaseline(){evidenceBaseline=JSON.parse(JSON.stringify(state.resume));}
function checkpointEvidence(){
 if(!evidenceBaseline){resetEvidenceBaseline();return;}
 const old=evidenceBaseline, cur=state.resume;
 if(JSON.stringify(old.master)!==JSON.stringify(cur.master)){
  cur.history=cur.history||[];cur.history.push({savedAt:new Date().toISOString(),master:old.master});
  cur.master.revision=uid('master');
 }
 (cur.variants||[]).forEach(v=>{
  const prev=(old.variants||[]).find(x=>x.id===v.id);
  if(prev && prev.submittedSnapshot)v.submittedSnapshot=prev.submittedSnapshot;
  if(prev && !prev.submittedSnapshot && (JSON.stringify(prev)!==JSON.stringify(v) || JSON.stringify(old.master)!==JSON.stringify(cur.master))){
   v.history=(prev.history||[]).concat([{savedAt:new Date().toISOString(),text:resumeTextFor(old.master,prev),source:old.master.source||''}]);
  }
 });
 resetEvidenceBaseline();
}
function recordSubmitted(id){
 const v=variantById(id);if(!v || v.submittedSnapshot)return;
 const text=resumeTextFor(resumeMaster(),v);
 if(/\[NEEDS YOUR INPUT\]|\[CONFIRM DATES\]/.test(text)){toast('Resolve placeholders before recording submission.');return;}
 openModal('<h3>Record a submitted copy<button class="x" data-action="close-modal">✕</button></h3><p>This records an application you already submitted. It sends nothing. The text below becomes immutable.</p><pre class="respre">'+esc(text)+'</pre><form>'+field('Actual submission date',inp('date','','type="date" required'))+'<label><input type="checkbox" required name="checked"> I checked this exact text against my submitted document and source evidence.</label><div class="modal-foot"><button class="btn primary">Save submitted record</button></div></form>',fd=>{
  v.submittedSnapshot={text,date:String(fd.get('date')),masterRevision:resumeMaster().revision||'',source:resumeMaster().source||''};

 },true);

document.addEventListener('click',e=>{

 if(el.dataset.action==='review-variant'){const v=activeVariant();if(v&&!v.submittedSnapshot){v.masterRevision=resumeMaster().revision;if(markDirty())toast('Draft reviewed against this master revision.');}}

(function installCandorAccessibility() {

  document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') lastTrigger = document.activeElement; }, true);

  function enhance() {
    document.querySelectorAll('.rpick,.rmini[data-action^="res-edit"]').forEach(button=>{
      const row=button.closest('.rrow');
      if(row){const text=(row.querySelector('.rtext')?.textContent||row.textContent||'item').trim().slice(0,90);button.setAttribute('aria-label',(button.classList.contains('rpick')?'Toggle inclusion: ':'Edit wording: ')+text);}

      const menu = document.querySelector(selector);
      if (menu) { const closed = !menu.closest(parent).classList.contains('open'); menu.inert = closed; menu.setAttribute('aria-hidden', String(closed)); }
    });
    document.querySelectorAll('.field, .dfield').forEach(field => {
      const label = field.querySelector('label'), control = field.querySelector('input, select, textarea');
      if (label && control) { if (!control.id) control.id = 'candor-field-' + (++fieldId); label.htmlFor = control.id; }
    });
    document.querySelectorAll('th[data-action="sort"]').forEach(th => {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'a11y-sort-button';
      button.dataset.action = 'sort'; button.dataset.key = th.dataset.key;
      th.setAttribute('scope', 'col');

      while (th.firstChild) button.appendChild(th.firstChild);

    });
    document.querySelectorAll('td[data-action="open-role"]').forEach(td => {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'a11y-cell-button';
      button.dataset.action = 'open-role'; button.dataset.id = td.dataset.id;

      if (control.getAttribute('aria-label') || control.getAttribute('aria-labelledby') || (control.labels && control.labels.length)) return;
      const row = control.dataset.id && state.applications.find(a => a.id === control.dataset.id);

      control.setAttribute('aria-label', label);
    });
    document.querySelectorAll('[data-action="close-modal"]').forEach(button => { if (button.classList.contains('x')) { button.type = 'button'; button.setAttribute('aria-label', 'Close dialog'); } });
    document.querySelectorAll('.dclose').forEach(button => button.setAttribute('aria-label', 'Close role details'));
    const modal = document.querySelector('#modal-back .modal');
    const drawerHost = document.getElementById('drawer-host');
    const drawer = drawerHost && drawerHost.classList.contains('open') ? drawerHost.querySelector('.drawer') : null;
    const overlay = modal || drawer;
    if (app) app.inert = Boolean(overlay);
    if (drawerHost) drawerHost.inert = Boolean(modal) || !drawer;
    if (overlay) {
      overlay.setAttribute('role', 'dialog'); overlay.setAttribute('aria-modal', 'true'); overlay.tabIndex = -1;
      const title = overlay.querySelector('h3, .dh-co');
      overlay.setAttribute('aria-label', title ? title.textContent.replace('✕', '').trim() : 'Role details');
      const kind = modal ? 'modal' : 'drawer';
      if (!previousOverlay) returnFocus = lastTrigger || document.activeElement;
      if (previousOverlay !== kind && !overlay.contains(document.activeElement)) (focusable(overlay)[0] || overlay).focus();
      previousOverlay = kind;
    } else if (previousOverlay) {
      previousOverlay = null;
      const target = returnFocus && returnFocus.isConnected && !returnFocus.closest('[inert]') ? returnFocus : document.getElementById('add-orb');
      if (target) target.focus();
      returnFocus = null;
    }
  }
  document.addEventListener('keydown', e => {
    const overlay = document.querySelector('#modal-back .modal') || document.querySelector('.drawer-host.open .drawer');
    if (!overlay) return;
    if (e.key === 'Escape') {
      e.preventDefault(); e.stopImmediatePropagation();
      if (document.getElementById('modal-back')) closeModal();
      else { openRoleId = null; render(); }
      enhance(); return;
    }
    if (e.key === 'Tab') {
      const nodes = focusable(overlay), first = nodes[0], last = nodes[nodes.length - 1];
      if (!first) { e.preventDefault(); overlay.focus(); }
      else if (e.shiftKey && (document.activeElement === first || !overlay.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (document.activeElement === last || !overlay.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
    }
  }, true);
  new MutationObserver(enhance).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
  enhance();
})();

</script>
